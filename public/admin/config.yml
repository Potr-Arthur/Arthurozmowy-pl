# Sveltia CMS · arthurozmowy.pl · konfiguracja redakcji
# PLIK GENEROWANY: zmiany wprowadzaj w narzedzia/generuj_config.py i uruchom go ponownie.
# Bez kotwic YAML, bo Sveltia czyta YAML ściśle. Bloki odpowiadają modułom makiety V2 (README, „Model treści”).
# Układ panelu: claude/CMS_panele_redakcji_v1.md. Listy adresów są zbudowane z plików treści.
backend:
  name: github
  repo: Potr-Arthur/arthurozmowy-pl
  branch: main
  preview_context: deploy-preview
  commit_messages:
    create: 'Treść: dodano {{collection}} „{{slug}}”'
    update: 'Treść: zmieniono {{collection}} „{{slug}}”'
    delete: 'Treść: usunięto {{collection}} „{{slug}}”'
    uploadMedia: 'Media: dodano „{{path}}”'
    deleteMedia: 'Media: usunięto „{{path}}”'
publish_mode: preview
app_title: Redakcja arthurozmowy
logo:
  src: /images/marka/arthur-ikona-192.png
media_folder: public/images
public_folder: /images
editor:
  preview: false
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: strony
  label: Strony
  label_singular: Strona
  icon: article
  description: Dziewięć stron z menu i strona błędu. Zmieniasz tu teksty, zdjęcia i wybór pytań; układ rozdziałów
    i bloków jest zablokowany. Zapis tworzy wersję roboczą z podglądem, a „Opublikuj” wysyła ją na witrynę.
  files:
  - name: strona-glowna
    label: Jej sprawy (strona główna)
    file: src/content/strony/strona-glowna.yml
    format: yml
    preview_path: /
    fields:
    - label: Nazwa strony
      name: strona
      widget: object
      collapsed: false
      required: false
      fields:
      - label: Nazwa strony
        name: nazwa
        widget: string
        required: true
        hint: Ta sama nazwa stoi nad H1 (wielkimi literami), w menu, w stopce i w linkach wewnętrznych. Zmieniasz
          ją też w Elementach wspólnych › Lista stron.
      - label: Szablon
        name: szablon
        widget: hidden
        default: glowna
    - label: Wejście (H1, zdjęcie, lid, bloki)
      name: wejscie
      widget: object
      collapsed: false
      required: false
      fields:
      - label: Nagłówek H1
        name: h1
        widget: text
        required: true
        hint: 'Jeden na stronę. Korzyść mamy w nagłówku (dominanta). Bez Entera. Słowa zakazane: senior, aktywny
          senior, podopieczny, osoba w wieku senioralnym, złota jesień, jesień życia, srebrna gospodarka, aktywizacja,
          monitoring, kontrola, nadzór, opiekun, kompleksowy, dedykowany, innowacyjny, nowoczesny, rewolucyjny.'
      - label: Zdjęcie wejścia
        name: zdjecie
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Plik zdjęcia
          name: plik
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
        - label: Kadr 4:3 na telefon
          name: plik_telefon
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
          hint: Na telefonie zamiast zdjęcia 21:9 stoi ten kadr (1200 × 900).
        - label: Tekst alternatywny (alt)
          name: alt
          widget: string
          required: false
          hint: Co naprawdę widać, słowami strony (mama, córka, opowiada, rozmowa). Jedno zdanie, 50–125 znaków.
            Nigdy „Arthur”, „arthurozmowy” ani „AI” przy zdjęciu człowieka.
          maxlength: 125
        - label: Pokaż zdjęcie
          name: widoczne
          widget: boolean
          default: true
          required: false
        hint: 'Wejście strony głównej: plik 21:9 i osobny kadr 4:3 na telefon. Nazwa pliku: arthurozmowy-{strona}-{treść}-{format}.webp.
          Obróbka promptem „Xiaomi – Huawei Style” (Księga, rozdz. 17), bez odmładzania.'
      - label: Lid H1 (kursywa pod nagłówkiem)
        name: lid
        widget: markdown
        required: false
        modes:
        - rich_text
        - raw
        buttons:
        - bold
        - italic
        - link
        - bulleted-list
        - numbered-list
        editor_components: []
        hint: 'Jeden akapit, który streszcza rozdział. Słowa zakazane: senior, aktywny senior, podopieczny, osoba
          w wieku senioralnym, złota jesień, jesień życia, srebrna gospodarka, aktywizacja, monitoring, kontrola,
          nadzór, opiekun, kompleksowy, dedykowany, innowacyjny, nowoczesny, rewolucyjny.'
      - label: Bloki, w kolejności wyświetlania
        name: bloki
        widget: list
        required: false
        collapsed: true
        typeKey: typ
        types:
        - label: Tekst akapitu
          name: tekst
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst
            name: tekst
            widget: markdown
            required: false
            modes:
            - rich_text
            - raw
            buttons:
            - bold
            - italic
            - link
            - bulleted-list
            - numbered-list
            editor_components: []
            hint: 'Akapity oddzielaj pustą linią. Znaczniki: {firma} (dane firmy), {email}, {telefon}, {godziny}.
              Słowa zakazane: senior, aktywny senior, podopieczny, osoba w wieku senioralnym, złota jesień, jesień
              życia, srebrna gospodarka, aktywizacja, monitoring, kontrola, nadzór, opiekun, kompleksowy, dedykowany,
              innowacyjny, nowoczesny, rewolucyjny.'
          summary: 'Tekst akapitu: {{fields.tekst}}'
        - label: Voice aside
          name: glos
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst
            name: tekst
            widget: markdown
            required: false
            modes:
            - rich_text
            - raw
            buttons:
            - bold
            - italic
            - link
            - bulleted-list
            - numbered-list
            editor_components: []
            hint: Jedna myśl, 1–3 zdania. Kursywa w kolorze rdzy na piasku. Znaczniki jak w tekście akapitu.
          summary: 'Voice aside: {{fields.tekst}}'
        - label: Lista
          name: lista
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Zdanie nad listą
            name: naglowek
            widget: string
            required: false
          - label: Punkty
            name: punkty
            widget: list
            required: false
            collapsed: false
            field:
              label: Punkt
              name: punkt
              widget: text
              required: false
            label_singular: Punkt
          - label: Lista numerowana
            name: numerowana
            widget: boolean
            default: false
            required: false
          summary: 'Lista: {{fields.naglowek}}'
        - label: Zasady (nagłówek H3, lid H3, tekst)
          name: zasady
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Zasady
            name: zasady
            widget: list
            required: false
            collapsed: true
            fields:
            - label: Zasada (nagłówek H3)
              name: naglowek
              widget: string
              required: false
              hint: Bez numeru, szablon go dopisuje.
            - label: Lid H3
              name: lid
              widget: text
              required: false
            - label: Tekst akapitu
              name: tekst
              widget: text
              required: false
            summary: '{{fields.naglowek}}'
            label_singular: Zasada
          summary: Zasady
        - label: Karta cytatu
          name: cytat
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Etykieta nad kartą
            name: etykieta
            widget: string
            required: false
            hint: Np. „Przykład rozmowy”, „Przykład”, „Przykład raportu”. Może zostać pusta.
          - label: Zdanie wstępu w karcie
            name: wstep
            widget: text
            required: false
          - label: Kwestie
            name: repliki
            widget: list
            required: false
            collapsed: true
            fields:
            - label: Kto mówi
              name: kto
              widget: string
              required: false
              hint: Mama, Arthur albo Ty. Puste pole = sam cytat.
            - label: Kwestia
              name: kwestia
              widget: text
              required: false
              hint: Bez cudzysłowu, szablon go dodaje.
            summary: '{{fields.kto}}: {{fields.kwestia}}'
            label_singular: Kwestia
          - label: Pokaż kartę
            name: widoczny
            widget: boolean
            default: true
            required: false
          hint: 'Przykładowy dialog mamy z Arthurem zawsze ma etykietę „Przykład rozmowy”, bo jest wymyślony. Nigdy
            fragment prawdziwej rozmowy z mamą. Etykieta „Przykład raportu” zmienia wygląd karty na raport: wstęp
            jest wtedy tematem raportu, a „Kto mówi” nagłówkiem części raportu.'
          summary: 'Karta cytatu: {{fields.etykieta}}'
        - label: Karty ceny
          name: cennik
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pakiety
            name: info
            widget: hidden
            required: false
          summary: Karty ceny (ceny w Elementach wspólnych)
        - label: Link wewnętrzny
          name: link
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst linku
