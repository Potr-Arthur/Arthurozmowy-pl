      widget: object
      collapsed: true
      required: false
      fields:
      - label: Wezwanie główne w stopce
        name: wezwanie_glowne
        widget: boolean
        default: true
        required: false
      - label: Linki prawne (pod listą stron, zakupem i Panelem klienta)
        name: linki_prawne
        widget: list
        required: false
        collapsed: true
        fields:
        - label: Tekst
          name: tekst
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
        summary: '{{fields.tekst}}'
      - label: Etykieta przy e-mailu
        name: kontakt_etykieta
        widget: string
        required: false
      - label: Zdanie o jawności
        name: jawnosc
        widget: string
        required: false
      - label: Zdanie o statystykach
        name: prywatnosc
        widget: string
        required: false
      - label: Linia praw autorskich i danych firmy
        name: prawa
        widget: string
        required: false
