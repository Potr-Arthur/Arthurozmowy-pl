# Sveltia CMS · arthurozmowy.pl · konfiguracja redakcji
# PLIK GENEROWANY: zmiany wprowadzaj w narzedzia/generuj_config.py i uruchom go ponownie.
# Bez kotwic YAML, bo Sveltia czyta YAML ściśle. Pola i bloki odpowiadają Matrycy (claude/Matryca_WITRYNA_v1.md).
# Logowanie do /admin osobistym tokenem GitHub; worker logowania (base_url) dodamy dla kolejnych redaktorów.
backend:
  name: github
  repo: Potr-Arthur/arthurozmowy-pl
  branch: main
  commit_messages:
    create: 'Treść: dodano {{collection}} „{{slug}}”'
    update: 'Treść: zmieniono {{collection}} „{{slug}}”'
    delete: 'Treść: usunięto {{collection}} „{{slug}}”'
    uploadMedia: 'Media: dodano „{{path}}”'
    deleteMedia: 'Media: usunięto „{{path}}”'
site_url: https://arthurozmowy.pl
display_url: https://arthurozmowy.pl
media_folder: public/images
public_folder: /images
collections:
- name: strony
  label: Strony
  label_singular: Strona
  description: Teksty stron arthurozmowy.pl, ułożone według bloków Matrycy.
  files:
  - name: strona-glowna
    label: Strona główna
    file: src/content/strony/strona-glowna.yml
    format: yml
    fields:
    - label: Strona
      name: strona
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Nazwa w CMS
        name: nazwa
        widget: string
        required: true
      - label: Szablon
        name: szablon
        widget: hidden
        default: glowna
    - label: Wyszukiwarki i udostępnianie (SEO)
      name: seo
      widget: object
      collapsed: false
      required: false
      fields:
      - label: Adres strony
        name: adres
        widget: string
        required: true
        hint: Zmiana adresu wymaga przekierowania 301 w netlify.toml.
        pattern:
        - ^/[a-z0-9/-]*$
        - Ścieżka od /, małe litery bez polskich znaków
      - label: Tytuł strony (title)
        name: tytul
        widget: string
        required: true
        hint: Najlepiej do 60 znaków, z nazwą arthurozmowy; Google pokazuje ok. 580 px.
        pattern:
        - ^.{10,70}$
        - 10–70 znaków
      - label: Opis w wynikach (meta description)
        name: opis
        widget: text
        required: false
        hint: 120–155 znaków. Pierwsze zdanie samo odpowiada, o czym jest strona (Google i AI).
        pattern:
        - ^[^\n]{0,160}$
        - Do 160 znaków, bez Entera
      - label: Obraz do udostępniania (1200 × 630)
        name: obraz_og
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Plik JPG
          name: plik
          widget: image
          required: false
          media_folder: /public/images/og
          public_folder: /images/og
        - label: Tekst alternatywny
          name: alt
          widget: string
          required: false
      - label: Dane strukturalne (JSON-LD)
        name: schemat
        widget: select
        options:
        - Organization
        - WebSite
        - WebPage
        - Service
        - Offer
        - FAQPage
        - HowTo
        - AboutPage
        - ContactPage
        - Person
        - BreadcrumbList
        multiple: true
        required: false
        hint: FAQPage tylko na stronie Pytania. Szablon buduje JSON-LD z treści i Ustawień.
      - label: Pokazuj w wyszukiwarkach
        name: indeksuj
        widget: boolean
        default: true
        required: false
      - label: Autor strony
        name: autor
        widget: string
        required: false
        default: Piotr Jaworski
      - label: Data aktualizacji
        name: zaktualizowano
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Zmieniaj przy każdej zmianie treści (Księga, rozdz. 21.6).
    - label: Streszczenie dla AI (GEO)
      name: geo
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Streszczenie strony
        name: streszczenie
        widget: text
        required: false
        hint: 2–3 zdania faktów z tej strony, w trzeciej osobie. Trafia do llms.txt i opisu w JSON-LD.
    - label: Wejście strony (H1, wstęp, zdjęcie)
      name: wejscie
      widget: object
      collapsed: false
      required: false
      fields:
      - label: 'Kotwica (adres sekcji po #)'
        name: kotwica
        widget: string
        required: false
        hint: Małe litery, bez polskich znaków, słowa łączone łącznikiem. Zmiana psuje linki do sekcji.
        pattern:
        - ^[a-z0-9-]*$
        - Tylko a–z, cyfry i łącznik
      - label: Etykieta w spisie treści
        name: etykieta
        widget: string
        required: false
        hint: Krótko, 1–4 słowa. Puste pole = sekcja nie trafia do spisu treści.
      - label: Nagłówek H1
        name: h1
        widget: text
        required: true
        hint: 'Jeden na stronę. Korzyść mamy w nagłówku (dominanta). Bez Entera. Słowa zakazane: senior, aktywny
          senior, podopieczny, złota jesień, srebrna gospodarka, aktywizacja, monitoring, kontrola, opiekun, nowoczesny.'
      - label: Słowo wyróżnione w H1 (tylko strona główna)
        name: h1_wyroznienie
        widget: string
        required: false
      - label: Wstęp (lid)
        name: lid
        widget: markdown
        required: false
        modes:
        - rich_text
        - raw
        buttons:
        - bold
        - italic
        - link
        - bulleted-list
        - numbered-list
        editor_components: []
        hint: 1–3 akapity. Pierwsze zdanie streszcza stronę.
      - label: Zdjęcie wejścia (blok 1 lub 2, 13)
        name: zdjecie
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Pokaż zdjęcie
          name: widoczne
          widget: boolean
          default: true
          required: false
        - label: Plik na komputer
          name: plik_desktop
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
          hint: Hero 21:9 (2100 × 900), pion 3:4 (900 × 1200), WebP.
        - label: Plik na telefon
          name: plik_telefon
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
          hint: 4:3 (1200 × 900), WebP.
        - label: Tekst alternatywny (alt)
          name: alt
          widget: string
          required: false
          hint: Co naprawdę widać, słowami strony (mama, córka, opowiada, rozmowa). Jedno zdanie, 50–125 znaków.
            Nigdy „Arthur”, „arthurozmowy” ani „AI” przy zdjęciu człowieka. Bez dopowiadania emocji i skutków.
        - label: Opis kadru dla redakcji (nie wyświetla się)
          name: kadr
          widget: text
          required: false
        hint: 'Nazwa pliku opisuje treść zdjęcia: arthurozmowy-{opis}-desk.webp i -tel.webp. Bez retuszu skóry.'
      - label: Wezwania (blok 12)
        name: wezwania
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Przycisk „Porozmawiaj z Arthurem” (otwiera okienko z formularzem)
          name: glowne
          widget: boolean
          default: false
          required: false
        - label: Dopisek pod przyciskiem (tylko wejście strony głównej)
          name: dopisek
          widget: boolean
          default: false
          required: false
        - label: Zdanie o jawności przy przycisku
          name: jawnosc
          widget: boolean
          default: false
          required: false
        - label: Przycisk „Umów mamie pierwszą arthurozmowę”
          name: zakupowe
          widget: boolean
          default: false
          required: false
        - label: Pytanie „Mama się zgodziła?” nad przyciskiem zakupowym
          name: nad_zakupowym
          widget: boolean
          default: false
          required: false
        hint: Teksty wezwań są w Ustawieniach, tu wybierasz tylko, które pokazać.
      - label: Pokaż autora i datę aktualizacji (blok 18)
        name: pokaz_autora_i_date
        widget: boolean
        default: true
        required: false
    - label: Sekcje strony
      name: sekcje
      widget: list
      required: false
      collapsed: true
      typeKey: typ
      types:
      - label: Rozdział (bloki 3, 4, 5, 7, 13, 16, 17)
        name: rozdzial
        widget: object
        collapsed: true
        required: false
        fields:
        - label: 'Kotwica (adres sekcji po #)'
          name: kotwica
          widget: string
          required: false
          hint: Małe litery, bez polskich znaków, słowa łączone łącznikiem. Zmiana psuje linki do sekcji.
          pattern:
          - ^[a-z0-9-]*$
          - Tylko a–z, cyfry i łącznik
        - label: Etykieta w spisie treści
          name: etykieta
          widget: string
          required: false
          hint: Krótko, 1–4 słowa. Puste pole = sekcja nie trafia do spisu treści.
        - label: Ton tła sekcji
          name: ton
          widget: select
          options:
          - label: t1 · rozdział (na przemian z t2)
            value: t1
          - label: t2 · rozdział (na przemian z t1)
            value: t2
          - label: t3
            value: t3
          - label: t4 · spokój, sprawy praktyczne
            value: t4
          - label: t5 · cena i pas wezwań na końcu strony
            value: t5
          multiple: false
          required: false
          default: t1
          hint: 'Matryca: przejścia gradientem między sekcjami; sąsiednie sekcje nie mają tego samego tonu.'
        - label: Nagłówek H2
          name: h2
          widget: text
          required: false
          hint: 'Jedno pełne zdanie, które samo odpowiada na pytanie sekcji (cytowalne przez AI). Bez Entera. Słowa
            zakazane: senior, aktywny senior, podopieczny, złota jesień, srebrna gospodarka, aktywizacja, monitoring,
            kontrola, opiekun, nowoczesny.'
        - label: Tekst
          name: tekst
          widget: markdown
          required: false
          modes:
          - rich_text
          - raw
          buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
          editor_components: []
          hint: Akapity oddzielaj pustą linią. Znacznik {firma} wstawia dane firmy z ustawień.
        - label: Definicje (blok 4)
          name: definicje
          widget: list
          required: false
          collapsed: true
          fields:
          - label: Termin (pogrubiony)
            name: termin
            widget: string
            required: false
          - label: Dalszy ciąg zdania
            name: opis
            widget: text
            required: false
          summary: '{{fields.termin}}'
        - label: Lista (blok 5)
          name: lista
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Zdanie nad listą (pogrubione)
            name: wprowadzenie
            widget: string
            required: false
          - label: Punkty
            name: punkty
            widget: list
            required: false
            collapsed: true
            field:
              label: Punkt
              name: punkt
              widget: text
              required: false
        - label: Cennik (blok 7, pakiety z Ustawień)
          name: cennik
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż cennik
            name: widoczny
            widget: boolean
            default: false
            required: false
          - label: Pokaż nazwy pakietów przy cenach
            name: pokaz_nazwy
            widget: boolean
            default: false
            required: false
        - label: Tekst pod listą lub cennikiem
          name: tekst_po
          widget: markdown
          required: false
          modes:
          - rich_text
          - raw
          buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
          editor_components: []
        - label: Akapit czekający na warunek
          name: akapit_ukryty
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż akapit
            name: widoczny
            widget: boolean
            default: false
            required: false
          - label: Tekst
            name: tekst
            widget: text
            required: false
          - label: Warunek publikacji (nie wyświetla się)
            name: warunek
            widget: string
            required: false
        - label: Zdjęcie (blok 13)
          name: zdjecie
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż zdjęcie
            name: widoczne
            widget: boolean
            default: true
            required: false
          - label: Plik na komputer
            name: plik_desktop
            widget: image
            required: false
            media_folder: /public/images/strony
            public_folder: /images/strony
            hint: Hero 21:9 (2100 × 900), pion 3:4 (900 × 1200), WebP.
          - label: Plik na telefon
            name: plik_telefon
            widget: image
            required: false
            media_folder: /public/images/strony
            public_folder: /images/strony
            hint: 4:3 (1200 × 900), WebP.
          - label: Tekst alternatywny (alt)
            name: alt
            widget: string
            required: false
            hint: Co naprawdę widać, słowami strony (mama, córka, opowiada, rozmowa). Jedno zdanie, 50–125 znaków.
              Nigdy „Arthur”, „arthurozmowy” ani „AI” przy zdjęciu człowieka. Bez dopowiadania emocji i skutków.
          - label: Opis kadru dla redakcji (nie wyświetla się)
            name: kadr
            widget: text
            required: false
          hint: 'Nazwa pliku opisuje treść zdjęcia: arthurozmowy-{opis}-desk.webp i -tel.webp. Bez retuszu skóry.'
        - label: Okno głosu (blok 17)
          name: okno_glosu
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż okno głosu
            name: widoczne
            widget: boolean
            default: false
            required: false
          - label: Wariant
            name: wariant
            widget: select
            options:
            - label: ciepłe
              value: cieple
            - label: głębia
              value: glebia
            - label: jasne
              value: jasne
            multiple: false
            required: false
            default: cieple
          - label: Etykieta
            name: etykieta
            widget: string
            required: false
            default: Przykład rozmowy
          - label: Dialog
            name: dialog
            widget: list
            required: false
            collapsed: true
            fields:
            - label: Kto mówi
              name: kto
              widget: select
              options:
              - Mama
              - Arthur
              multiple: false
              required: false
              default: Mama
            - label: Kwestia
              name: kwestia
              widget: text
              required: false
            summary: '{{fields.kto}}: {{fields.kwestia}}'
          - label: Pojedyncze zdanie Arthura (zamiast dialogu)
            name: zdanie
            widget: text
            required: false
          - label: Przypis pod oknem
            name: przypis
            widget: text
            required: false
          - label: Nagranie głosu (opcjonalnie)
            name: nagranie
            widget: object
            collapsed: true
            required: false
            fields:
            - label: Plik audio
              name: plik
              widget: file
              required: false
              media_folder: /public/audio
              public_folder: /audio
            - label: Transkrypcja (wymagana przy nagraniu)
              name: transkrypcja
              widget: text
              required: false
          hint: Najwyżej jedno w rozdziale i trzy na stronie. Przykład rozmowy zawsze z etykietą „Przykład rozmowy”
            i przypisem, że jest wymyślony. Nagranie tylko demonstracyjne, nigdy z prawdziwej rozmowy z mamą.
        - label: Cudze zdanie (blok 16)
          name: cudze_zdanie
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż cytat
            name: widoczne
            widget: boolean
            default: false
            required: false
          - label: Cytat
            name: cytat
            widget: text
            required: false
          - label: Podpis (np. imię i wiek, za zgodą)
            name: kto
            widget: string
            required: false
          - label: Mamy udokumentowaną zgodę na publikację
            name: zgoda
            widget: boolean
            default: false
            required: false
          hint: Tylko prawdziwe zdanie mamy i tylko za jej udokumentowaną zgodą. Do tego czasu ukryte.
        - label: Linki ze strzałką (blok 11)
          name: linki
          widget: list
          required: false
          collapsed: true
          fields:
          - label: Tekst linku
            name: tekst
            widget: string
            required: true
          - label: Adres
            name: adres
            widget: string
            required: false
            hint: Ścieżka wewnętrzna, np. /jak-to-dziala albo /jak-skorzystac#rezygnacja.
          - label: Link aktywny
            name: aktywny
            widget: boolean
            default: true
            required: false
            hint: Wyłącz, dopóki strona docelowa nie istnieje.
          summary: '{{fields.tekst}} → {{fields.adres}}'
        - label: Wezwania (blok 12)
          name: wezwania
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Przycisk „Porozmawiaj z Arthurem” (otwiera okienko z formularzem)
            name: glowne
            widget: boolean
            default: false
            required: false
          - label: Dopisek pod przyciskiem (tylko wejście strony głównej)
            name: dopisek
            widget: boolean
            default: false
            required: false
          - label: Zdanie o jawności przy przycisku
            name: jawnosc
            widget: boolean
            default: false
            required: false
          - label: Przycisk „Umów mamie pierwszą arthurozmowę”
            name: zakupowe
            widget: boolean
            default: false
            required: false
          - label: Pytanie „Mama się zgodziła?” nad przyciskiem zakupowym
            name: nad_zakupowym
            widget: boolean
            default: false
            required: false
          hint: Teksty wezwań są w Ustawieniach, tu wybierasz tylko, które pokazać.
        summary: '{{fields.etykieta}} · {{fields.ton}}'
      - label: Lista zasad (blok 6)
        name: zasady
        widget: object
        collapsed: true
        required: false
        fields:
        - label: 'Kotwica (adres sekcji po #)'
          name: kotwica
          widget: string
          required: false
          hint: Małe litery, bez polskich znaków, słowa łączone łącznikiem. Zmiana psuje linki do sekcji.
          pattern:
          - ^[a-z0-9-]*$
          - Tylko a–z, cyfry i łącznik
        - label: Etykieta w spisie treści
          name: etykieta
          widget: string
          required: false
          hint: Krótko, 1–4 słowa. Puste pole = sekcja nie trafia do spisu treści.
        - label: Ton tła sekcji
          name: ton
          widget: select
          options:
          - label: t1 · rozdział (na przemian z t2)
            value: t1
          - label: t2 · rozdział (na przemian z t1)
            value: t2
          - label: t3
            value: t3
          - label: t4 · spokój, sprawy praktyczne
            value: t4
          - label: t5 · cena i pas wezwań na końcu strony
            value: t5
          multiple: false
          required: false
          default: t1
          hint: 'Matryca: przejścia gradientem między sekcjami; sąsiednie sekcje nie mają tego samego tonu.'
        - label: Nagłówek H2
          name: h2
          widget: text
          required: false
          hint: 'Jedno pełne zdanie, które samo odpowiada na pytanie sekcji (cytowalne przez AI). Bez Entera. Słowa
            zakazane: senior, aktywny senior, podopieczny, złota jesień, srebrna gospodarka, aktywizacja, monitoring,
            kontrola, opiekun, nowoczesny.'
        - label: Tekst
          name: tekst
          widget: markdown
          required: false
          modes:
          - rich_text
          - raw
          buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
          editor_components: []
          hint: Akapity oddzielaj pustą linią. Znacznik {firma} wstawia dane firmy z ustawień.
        - label: Zasady
          name: zasady
          widget: list
          required: false
          collapsed: true
          fields:
          - label: Zasada (pogrubione zdanie)
            name: naglowek
            widget: string
            required: false
          - label: Opis
            name: tekst
            widget: text
            required: false
          - label: Dlaczego
            name: dlaczego
            widget: text
            required: false
            hint: Bez słowa „Dlaczego:”, szablon dopisuje je od nowej linii (R168).
          summary: '{{fields.naglowek}}'
        - label: Linki ze strzałką (blok 11)
          name: linki
          widget: list
          required: false
          collapsed: true
          fields:
          - label: Tekst linku
            name: tekst
            widget: string
            required: true
          - label: Adres
            name: adres
            widget: string
            required: false
            hint: Ścieżka wewnętrzna, np. /jak-to-dziala albo /jak-skorzystac#rezygnacja.
          - label: Link aktywny
            name: aktywny
            widget: boolean
            default: true
            required: false
            hint: Wyłącz, dopóki strona docelowa nie istnieje.
          summary: '{{fields.tekst}} → {{fields.adres}}'
        - label: Wezwania (blok 12)
          name: wezwania
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Przycisk „Porozmawiaj z Arthurem” (otwiera okienko z formularzem)
            name: glowne
            widget: boolean
            default: false
            required: false
          - label: Dopisek pod przyciskiem (tylko wejście strony głównej)
            name: dopisek
            widget: boolean
            default: false
            required: false
          - label: Zdanie o jawności przy przycisku
            name: jawnosc
            widget: boolean
            default: false
            required: false
          - label: Przycisk „Umów mamie pierwszą arthurozmowę”
            name: zakupowe
            widget: boolean
            default: false
            required: false
          - label: Pytanie „Mama się zgodziła?” nad przyciskiem zakupowym
            name: nad_zakupowym
            widget: boolean
            default: false
            required: false
          hint: Teksty wezwań są w Ustawieniach, tu wybierasz tylko, które pokazać.
        summary: '{{fields.etykieta}} · {{fields.ton}}'
      - label: Krok z przykładem (blok 9)
        name: krok
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Numer kroku
          name: numer
          widget: number
          value_type: int
