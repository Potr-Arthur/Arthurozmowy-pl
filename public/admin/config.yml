    widget: object
    collapsed: true
    required: false
    fields:
    - label: Definicja arthurozmów
      name: definicja
      widget: text
      required: false
      hint: Słowo w słowo to samo w odpowiedzi „Czym są arthurozmowy?”, w danych dla Google i w llms.txt.
    - label: Logo
      name: logo
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Plik SVG
        name: plik
        widget: image
        required: false
        media_folder: /public/images/marka
        public_folder: /images/marka
      - label: Alt
        name: alt
        widget: string
        required: false
    - label: Nazwa usługi
      name: nazwa
      widget: string
      required: false
      readonly: true
    - label: Domena
      name: domena
      widget: string
      required: false
      readonly: true
    - label: Język
      name: jezyk
      widget: string
      required: false
      readonly: true
  - label: Autor stron
    name: autor
    widget: object
    collapsed: true
    required: false
    fields:
    - label: Imię i nazwisko
      name: imie_nazwisko
      widget: string
      required: false
    - label: Strona autora
      name: adres_strony
      widget: string
      required: false
