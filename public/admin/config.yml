- name: kampanie
  label: Strony kampanii
  label_singular: Strona kampanii
  icon: campaign
  description: Strony pod konkretne reklamy, poza menu i mapą strony. Tu możesz dodawać, usuwać i przestawiać rozdziały
    i bloki. Strona kampanii mówi o rozmowach, a nie o zdrowiu (ograniczenia reklam Google i Meta).
  folder: src/content/kampanie
  extension: yml
  format: yml
  create: true
  delete: true
  identifier_field: nazwa_robocza
  slug: '{{fields.adres}}'
  summary: '{{fields.nazwa_robocza}} · /{{fields.adres}}'
  preview_path: /{{fields.adres}}
  fields:
  - label: Nazwa robocza
    name: nazwa_robocza
    widget: string
    required: true
    hint: Widać ją tylko w panelu, np. „Google Ads · listopad · rozmowy o książkach”.
  - label: Adres strony
    name: adres
    widget: string
    required: true
    hint: Część adresu po arthurozmowy.pl/, np. mama-ma-swoje-sprawy. Po starcie kampanii go nie zmieniaj, bo prowadzą
      na niego reklamy. Nie może powtarzać adresu innej strony.
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - Małe litery bez polskich znaków, cyfry i łącznik
  - label: Nazwa strony i układ wejścia
