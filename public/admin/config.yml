      - label: Bloki, w kolejności wyświetlania
        name: bloki
        widget: list
        required: false
        collapsed: true
        typeKey: typ
        types:
        - label: Tekst akapitu
          name: tekst
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst
            name: tekst
            widget: markdown
            required: false
            modes:
            - rich_text
            - raw
            buttons:
            - bold
            - italic
            - link
            - bulleted-list
            - numbered-list
            editor_components: []
            hint: 'Akapity oddzielaj pustą linią. Znaczniki: {firma} (dane firmy), {email}, {telefon}, {godziny}.
