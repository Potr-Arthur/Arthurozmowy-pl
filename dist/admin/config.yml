- name: pytania
  label: Pytania i odpowiedzi
  description: Jedno źródło odpowiedzi dla strony Pytania i akordeonów na podstronach.
  files:
  - name: baza
    label: Baza pytań
    file: src/content/pytania/baza.yml
    format: yml
    fields:
    - label: Pytania i odpowiedzi
      name: pytania
      widget: list
      required: false
      collapsed: true
      fields:
      - label: Identyfikator
        name: id
        widget: string
        required: true
        hint: Stały, małe litery i łącznik. Strony odwołują się do pytania po identyfikatorze.
        pattern:
        - ^[a-z0-9-]+$
        - Tylko a–z, cyfry i łącznik
      - label: Pytanie
        name: pytanie
        widget: string
        required: true
        hint: Tak, jak zadałaby je córka.
      - label: Odpowiedź
        name: odpowiedz
        widget: markdown
        required: true
        modes:
        - rich_text
        - raw
        buttons:
        - bold
        - italic
        - link
        - bulleted-list
        - numbered-list
        editor_components: []
        hint: 'Pierwsze zdanie zawiera całą odpowiedź (GEO). Słowa zakazane: senior, aktywny senior, podopieczny,
          złota jesień, srebrna gospodarka, aktywizacja, monitoring, kontrola, opiekun, nowoczesny.'
      - label: Link wewnętrzny pod odpowiedzią
        name: link
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Tekst linku
          name: tekst
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
      summary: '{{fields.pytanie}}'
- name: ustawienia
  label: Ustawienia
  description: 'Belka, lista stron, przyciski CTA, okienka, pakiety, dane firmy i stopka: raz, dla wszystkich stron.'
  files:
  - name: witryna
    label: Ustawienia witryny
    file: src/content/ustawienia/witryna.yml
    format: yml
    fields:
    - label: Marka
      name: marka
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Nazwa usługi
        name: nazwa
        widget: string
        required: false
        hint: Zawsze jednym słowem, małą literą w tekście ciągłym.
      - label: Domena
        name: domena
        widget: string
        required: false
      - label: Język
        name: jezyk
        widget: string
        required: false
      - label: Definicja arthurozmów
        name: definicja
        widget: text
        required: false
        hint: Słowo w słowo to samo w odpowiedzi „Czym są arthurozmowy?”, w JSON-LD i w llms.txt.
      - label: Logo
        name: logo
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Plik SVG
          name: plik
          widget: image
          required: false
          media_folder: /public/images/marka
          public_folder: /images/marka
        - label: Alt
          name: alt
          widget: string
          required: false
    - label: Belka górna i menu
      name: naglowek
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Napis na przycisku menu
        name: menu
        widget: string
        required: false
      - label: Napis nad rozdziałami strony
        name: grupa_rozdzialy
        widget: string
        required: false
        hint: Szablon dopisuje nazwę strony, np. „Na stronie Jak działa Arthur”.
      - label: Nazwa grupy stron
        name: grupa_strony
        widget: string
        required: false
      - label: Linki w belce (np. Cena, Kontakt)
        name: linki
        widget: list
        required: false
        collapsed: true
        fields:
        - label: Tekst
          name: tekst
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
        summary: '{{fields.tekst}} → {{fields.adres}}'
      - label: Napis na przycisku zamówienia w belce
        name: zakup
        widget: string
        required: false
      - label: Napis linku do panelu klienta
        name: panel_klienta
        widget: string
        required: false
      - label: Przycisk „Porozmawiaj z Arthurem” przyklejony do dołu ekranu na telefonie
        name: przycisk_staly
        widget: boolean
        default: true
        required: false
      hint: 'Od lewej: logo, przycisk Menu, linki, przycisk zamówienia i Panel klienta. Menu to jedna lista stron;
        rozdziały stoją pod stroną oglądaną albo wskazaną.'
    - label: Lista stron (menu i stopka)
      name: nawigacja
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Strony
        name: strony
        widget: list
        required: false
        collapsed: true
        fields:
        - label: Tekst
          name: tekst
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
        summary: '{{fields.tekst}} → {{fields.adres}}'
      - label: Napis linku pod akordeonem pytań
        name: wszystkie_pytania
        widget: string
        required: false
      - label: Słowo przed linkiem wewnętrznym
        name: wiecej
        widget: string
        required: false
        hint: Np. „Więcej:”. Po nim stoi nazwa strony albo rozdziału.
      hint: 'Jeden temat, jedna nazwa: nazwa strony taka sama w menu, stopce, linkach wewnętrznych i spisie treści
        strony głównej.'
    - label: Przyciski CTA
      name: wezwania
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Porozmawiaj z Arthurem (otwiera okienko rozmowy)
        name: glowne
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Przycisk
          name: przycisk
          widget: string
          required: false
        - label: Objaśnienie pod przyciskiem
          name: dopisek
          widget: text
          required: false
      - label: Zamówienie
        name: zakupowe
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Przycisk
          name: przycisk
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
      - label: Napisz do nas (otwiera okienko kontaktu)
        name: napisz
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Przycisk
          name: przycisk
          widget: string
          required: false
    - label: Okienko „Porozmawiaj z Arthurem”
      name: okno_rozmowy
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Tytuł
        name: tytul
        widget: string
        required: false
      - label: Wstęp
        name: wstep
        widget: text
        required: false
      - label: 'Pole: numer'
        name: pole_numer
        widget: string
        required: false
      - label: Pytanie o porę
        name: pytanie_kiedy
        widget: string
        required: false
      - label: 'Opcja: teraz'
        name: opcja_teraz
        widget: string
        required: false
      - label: 'Opcja: termin'
        name: opcja_termin
        widget: string
        required: false
      - label: 'Pole: data'
        name: pole_data
        widget: string
        required: false
      - label: 'Pole: godzina'
        name: pole_godzina
        widget: string
        required: false
      - label: Przycisk
        name: przycisk
        widget: string
        required: false
      - label: Potwierdzenie
        name: potwierdzenie
        widget: text
        required: false
      - label: Komunikat błędu
        name: blad
        widget: text
        required: false
      - label: Zgoda i informacja RODO
        name: zgoda
        widget: text
        required: false
      hint: Włączamy po ocenie skutków dla ochrony danych (Z6) i z polityką prywatności.
    - label: Okienko „Napisz do nas”
      name: okno_kontaktu
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Tytuł
        name: tytul
        widget: string
        required: false
      - label: Wstęp
        name: wstep
        widget: text
        required: false
      - label: 'Pole: imię'
        name: pole_imie
        widget: string
        required: false
      - label: 'Pole: e-mail'
        name: pole_email
        widget: string
        required: false
      - label: 'Pole: telefon'
        name: pole_telefon
        widget: string
        required: false
      - label: 'Pole: wiadomość'
        name: pole_wiadomosc
        widget: string
        required: false
      - label: Przycisk
        name: przycisk
        widget: string
        required: false
      - label: Potwierdzenie
        name: potwierdzenie
        widget: text
        required: false
      - label: Komunikat błędu
        name: blad
        widget: text
        required: false
      - label: Zgoda i informacja RODO
        name: zgoda
        widget: text
        required: false
      hint: Włączamy po ocenie skutków dla ochrony danych (Z6) i z polityką prywatności.
    - label: Pakiety i ceny
      name: pakiety
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Waluta
        name: waluta
        widget: string
        required: false
      - label: Dopisek przy cenie
        name: okres
        widget: string
        required: false
      - label: Długość rozmów (zdanie na każdej karcie ceny)
        name: dlugosc
        widget: string
        required: false
        hint: Długość jednej rozmowy, nigdy suma minut w miesiącu.
      - label: Pakiety
        name: lista
        widget: list
        required: false
        collapsed: true
        fields:
        - label: Cena (zł brutto)
          name: cena
          widget: number
          value_type: int
          required: true
        - label: Rozmowy pełne
          name: rozmowy_pelne
          widget: number
          value_type: int
        - label: Rozmowy podtrzymujące
          name: rozmowy_podtrzymujace
          widget: number
          value_type: int
        - label: Opis na karcie ceny
          name: opis
          widget: string
          required: false
          hint: Z odmianą, np. „6 rozmów pełnych i 8 rozmów podtrzymujących”.
        - label: Rytm tygodnia na karcie ceny
          name: rytm
          widget: string
          required: false
          hint: Np. „co tydzień 1–2 rozmowy pełne i 2 podtrzymujące”.
        - label: Nazwa pakietu
          name: nazwa
          widget: string
          required: false
          hint: Małą literą, np. „pakiet optymalny”.
        - label: Pakiet proponowany na początek
          name: polecany
          widget: boolean
          default: false
          required: false
        summary: '{{fields.cena}} zł · {{fields.opis}}'
    - label: Dane firmy
      name: firma
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Nazwa
        name: nazwa
        widget: string
        required: false
      - label: Ulica i numer
        name: ulica
        widget: string
        required: false
      - label: Kod pocztowy
        name: kod_pocztowy
        widget: string
        required: false
      - label: Miejscowość
        name: miejscowosc
        widget: string
        required: false
      - label: Kraj (kod)
        name: kraj
        widget: string
        required: false
      - label: NIP
        name: nip
        widget: string
        required: false
      - label: E-mail
        name: email
        widget: string
        required: false
      - label: Telefon
        name: telefon
        widget: string
        required: false
      - label: Godziny odbierania telefonu
        name: telefon_godziny
        widget: string
        required: false
      - label: Adres panelu klienta
        name: panel_klienta
        widget: string
        required: false
      hint: 'Znaczniki w tekstach: {firma}, {email}, {telefon}, {godziny}.'
    - label: Autor
      name: autor
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Imię i nazwisko
        name: imie_nazwisko
        widget: string
        required: false
      - label: Strona autora
        name: adres_strony
        widget: string
        required: false
    - label: Stopka
      name: stopka
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Przyciski CTA na górze stopki
        name: wezwania
        widget: select
        options:
        - label: Porozmawiaj z Arthurem
          value: glowne
        - label: Umów mamie próbne arthurozmowy
          value: zakupowe
        - label: Napisz do nas
          value: napisz
        multiple: true
        required: false
      - label: Zdanie o statystykach
        name: prywatnosc
        widget: string
        required: false
      - label: Linia praw autorskich i danych firmy
        name: prawa
        widget: string
        required: false
      - label: Linki prawne
        name: linki_prawne
        widget: list
        required: false
        collapsed: true
        fields:
        - label: Tekst
          name: tekst
          widget: string
          required: false
        - label: Adres
          name: adres
          widget: string
          required: false
        summary: '{{fields.tekst}}'
