# Sveltia CMS · arthurozmowy.pl · konfiguracja redakcji
# PLIK GENEROWANY: zmiany wprowadzaj w narzedzia/generuj_config.py i uruchom go ponownie.
# Bez kotwic YAML, bo Sveltia czyta YAML ściśle. Bloki odpowiadają modułom makiety V2 (README, „Model treści”).
# Logowanie do /admin osobistym tokenem GitHub; worker logowania (base_url) dodamy dla kolejnych redaktorów.
backend:
  name: github
  repo: Potr-Arthur/arthurozmowy-pl
  branch: main
  commit_messages:
    create: 'Treść: dodano {{collection}} „{{slug}}”'
    update: 'Treść: zmieniono {{collection}} „{{slug}}”'
    delete: 'Treść: usunięto {{collection}} „{{slug}}”'
    uploadMedia: 'Media: dodano „{{path}}”'
    deleteMedia: 'Media: usunięto „{{path}}”'
site_url: https://arthurozmowy.pl
display_url: https://arthurozmowy.pl
media_folder: public/images
public_folder: /images
collections:
- name: strony
  label: Strony
  label_singular: Strona
  description: 'Teksty stron arthurozmowy.pl: wejście i rozdziały, w rozdziale bloki (moduły makiety).'
  files:
  - name: strona-glowna
    label: Jej sprawy (strona główna)
    file: src/content/strony/strona-glowna.yml
    format: yml
    fields:
    - label: Strona
      name: strona
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Nazwa strony
        name: nazwa
        widget: string
        required: true
        hint: Ta sama nazwa stoi nad H1 (wielkimi literami), w menu, w stopce i w linkach wewnętrznych.
      - label: Szablon
        name: szablon
        widget: hidden
        default: glowna
    - label: Wyszukiwarki i udostępnianie (SEO)
      name: seo
      widget: object
      collapsed: false
      required: false
      fields:
      - label: Adres strony
        name: adres
        widget: string
        required: true
        hint: Zmiana adresu wymaga przekierowania 301 w netlify.toml.
        pattern:
        - ^/[a-z0-9/-]*$
        - Ścieżka od /, małe litery bez polskich znaków
      - label: Tytuł strony (title)
        name: tytul
        widget: string
        required: true
        hint: Najlepiej do 60 znaków, z nazwą arthurozmowy; Google pokazuje ok. 580 px.
        pattern:
        - ^.{10,70}$
        - 10–70 znaków
      - label: Opis w wynikach (meta description)
        name: opis
        widget: text
        required: false
        hint: 120–155 znaków. Pierwsze zdanie samo odpowiada, o czym jest strona (Google i AI).
        pattern:
        - ^[^\n]{0,160}$
        - Do 160 znaków, bez Entera
      - label: Obraz do udostępniania (1200 × 630)
        name: obraz_og
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Plik JPG
          name: plik
          widget: image
          required: false
          media_folder: /public/images/og
          public_folder: /images/og
        - label: Tekst alternatywny
          name: alt
          widget: string
          required: false
      - label: Dane strukturalne (JSON-LD)
        name: schemat
        widget: select
        options:
        - Organization
        - WebSite
        - WebPage
        - Service
        - Offer
        - FAQPage
        - HowTo
        - AboutPage
        - ContactPage
        - Person
        - BreadcrumbList
        multiple: true
        required: false
        hint: FAQPage tylko na stronie Pytania. Szablon buduje JSON-LD z treści i Ustawień.
      - label: Pokazuj w wyszukiwarkach
        name: indeksuj
        widget: boolean
        default: true
        required: false
      - label: Autor strony
        name: autor
        widget: string
        required: false
        default: Piotr Jaworski
      - label: Data aktualizacji
        name: zaktualizowano
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Zmieniaj przy każdej zmianie treści. Autor i data trafiają do danych strukturalnych.
    - label: Streszczenie dla AI (GEO)
      name: geo
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Streszczenie strony
        name: streszczenie
        widget: text
        required: false
        hint: 2–5 zdań faktów z tej strony, w trzeciej osobie. Trafia do llms.txt.
    - label: Wejście strony (H1, zdjęcie, lid, bloki)
      name: wejscie
      widget: object
      collapsed: false
      required: false
      fields:
      - label: 'Kotwica (adres rozdziału po #)'
        name: kotwica
        widget: string
        required: false
        hint: Małe litery, bez polskich znaków, słowa łączone łącznikiem. Zmiana psuje linki do rozdziału.
        pattern:
        - ^[a-z0-9-]*$
        - Tylko a–z, cyfry i łącznik
      - label: Nazwa rozdziału w menu („Na stronie …”)
        name: etykieta
        widget: string
        required: false
        hint: Krótko, 1–4 słowa. Puste pole = rozdziału nie ma w menu.
      - label: Nagłówek H1
        name: h1
        widget: text
        required: true
        hint: 'Jeden na stronę. Korzyść mamy w nagłówku (dominanta). Bez Entera. Słowa zakazane: senior, aktywny
          senior, podopieczny, złota jesień, srebrna gospodarka, aktywizacja, monitoring, kontrola, opiekun, nowoczesny.'
      - label: Zdjęcie wejścia
        name: zdjecie
        widget: object
        collapsed: true
        required: false
        fields:
        - label: Pokaż zdjęcie
          name: widoczne
          widget: boolean
          default: true
          required: false
        - label: Plik zdjęcia
          name: plik
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
        - label: Kadr 4:3 na telefon (tylko wejście strony głównej)
          name: plik_telefon
          widget: image
          required: false
          media_folder: /public/images/strony
          public_folder: /images/strony
        - label: Tekst alternatywny (alt)
          name: alt
          widget: string
          required: false
          hint: Co naprawdę widać, słowami strony (mama, córka, opowiada, rozmowa). Jedno zdanie, 50–125 znaków.
            Nigdy „Arthur”, „arthurozmowy” ani „AI” przy zdjęciu człowieka. Bez dopowiadania emocji i skutków.
        hint: 'Wejście strony głównej: plik 21:9 i osobny kadr 4:3 na telefon. Nazwa pliku: arthurozmowy-{strona}-{treść}-{format}.webp.
          Bez retuszu skóry.'
      - label: Lid H1 (kursywa pod nagłówkiem)
        name: lid
        widget: markdown
        required: false
        modes:
        - rich_text
        - raw
        buttons:
        - bold
        - italic
        - link
        - bulleted-list
        - numbered-list
        editor_components: []
        hint: 'Jeden akapit, który streszcza rozdział. Słowa zakazane: senior, aktywny senior, podopieczny, złota
          jesień, srebrna gospodarka, aktywizacja, monitoring, kontrola, opiekun, nowoczesny.'
      - label: Bloki, w kolejności wyświetlania
        name: bloki
        widget: list
        required: false
        collapsed: true
        typeKey: typ
        types:
        - label: Tekst akapitu
          name: tekst
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst
            name: tekst
            widget: markdown
            required: false
            modes:
            - rich_text
            - raw
            buttons:
            - bold
            - italic
            - link
            - bulleted-list
            - numbered-list
            editor_components: []
            hint: 'Akapity oddzielaj pustą linią. Znaczniki: {firma} (dane firmy), {email}, {telefon}, {godziny}.
              Słowa zakazane: senior, aktywny senior, podopieczny, złota jesień, srebrna gospodarka, aktywizacja,
              monitoring, kontrola, opiekun, nowoczesny.'
          summary: 'Tekst: {{fields.tekst}}'
        - label: Voice aside (karta w kolorze piasku, kursywa)
          name: glos
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst
            name: tekst
            widget: markdown
            required: false
            modes:
            - rich_text
            - raw
            buttons:
            - bold
            - italic
            - link
            - bulleted-list
            - numbered-list
            editor_components: []
            hint: Jedna myśl, 1–3 zdania. Znaczniki jak w tekście akapitu.
          summary: 'Voice aside: {{fields.tekst}}'
        - label: Lista punktów
          name: lista
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Zdanie nad listą
            name: naglowek
            widget: string
            required: false
          - label: Lista numerowana
            name: numerowana
            widget: boolean
            default: false
            required: false
          - label: Punkty
            name: punkty
            widget: list
            required: false
            collapsed: true
            field:
              label: Punkt
              name: punkt
              widget: text
              required: false
          summary: 'Lista: {{fields.naglowek}}'
        - label: Zasady (nagłówek H3, lid H3, tekst)
          name: zasady
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Zasady
            name: zasady
            widget: list
            required: false
            collapsed: true
            fields:
            - label: Zasada (nagłówek H3)
              name: naglowek
              widget: string
              required: false
              hint: Bez numeru, szablon go dopisuje.
            - label: Lid H3
              name: lid
              widget: text
              required: false
            - label: Tekst akapitu
              name: tekst
              widget: text
              required: false
            summary: '{{fields.naglowek}}'
          summary: Zasady
        - label: Karta cytatu (żółta karta)
          name: cytat
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pokaż kartę
            name: widoczny
            widget: boolean
            default: true
            required: false
          - label: Etykieta nad kartą
            name: etykieta
            widget: string
            required: false
            hint: Np. „Przykład rozmowy”, „Przykład”. Może zostać pusta.
          - label: Zdanie wstępu w karcie
            name: wstep
            widget: text
            required: false
          - label: Kwestie
            name: repliki
            widget: list
            required: false
            collapsed: true
            fields:
            - label: Kto mówi
              name: kto
              widget: string
              required: false
              hint: Mama, Arthur albo Ty. Puste pole = sam cytat.
            - label: Kwestia
              name: kwestia
              widget: text
              required: false
              hint: Bez cudzysłowu, szablon go dodaje.
            summary: '{{fields.kto}}: {{fields.kwestia}}'
          hint: Przykładowy dialog mamy z Arthurem zawsze ma etykietę „Przykład rozmowy”, bo jest wymyślony. Nigdy
            fragment prawdziwej rozmowy z mamą.
          summary: 'Karta cytatu: {{fields.etykieta}}'
        - label: Karty ceny (pakiety z Ustawień)
          name: cennik
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pakiety
            name: info
            widget: hidden
            required: false
          summary: Karty ceny
        - label: Link wewnętrzny („Więcej:” i nazwa w ramce rdzy)
          name: link
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Tekst linku
            name: tekst
            widget: string
            required: true
            hint: Nazwa strony albo rozdziału, do którego prowadzi (jeden temat, jedna nazwa).
          - label: Adres
            name: adres
            widget: string
            required: false
            hint: Ścieżka wewnętrzna, np. /jak-dziala-arthur albo /jak-korzystac#rezygnacja.
          - label: Link aktywny
            name: aktywny
            widget: boolean
            default: true
            required: false
            hint: Wyłącz, dopóki strona docelowa nie istnieje.
          summary: 'Link: {{fields.tekst}} → {{fields.adres}}'
        - label: Przycisk CTA (błękitny)
          name: wezwanie
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Który przycisk
            name: rodzaj
            widget: select
            options:
            - label: Porozmawiaj z Arthurem (okienko z formularzem rozmowy)
              value: glowne
            - label: Umów mamie próbne arthurozmowy (zamówienie)
              value: zakupowe
            - label: Napisz do nas (okienko z formularzem kontaktu)
              value: napisz
            multiple: false
            required: true
            default: glowne
            hint: Teksty przycisków zmieniasz w Ustawieniach.
          - label: Pokaż objaśnienie pod przyciskiem (tylko „Porozmawiaj z Arthurem”)
            name: objasnienie
            widget: boolean
            default: false
            required: false
          summary: 'Przycisk CTA: {{fields.rodzaj}}'
        - label: Karty pytań, stale rozwinięte (strona Pytania)
          name: pytania
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Pytania z bazy, w kolejności
            name: pytania
            widget: relation
            required: false
            collection: pytania
            file: baza
            value_field: pytania.*.id
            search_fields:
            - pytania.*.pytanie
            display_fields:
            - pytania.*.pytanie
            multiple: true
          summary: Pytania z bazy
        - label: Najczęstsze pytania (akordeon z 3 pytaniami)
          name: faq
          widget: object
          collapsed: true
          required: false
          fields:
          - label: Trzy pytania z bazy
            name: pytania
            widget: relation
            required: false
            collection: pytania
            file: baza
            value_field: pytania.*.id
            search_fields:
            - pytania.*.pytanie
            display_fields:
            - pytania.*.pytanie
            multiple: true
            min: 3
            max: 3
          hint: Pod akordeonem szablon dodaje link „Wszystkie pytania” → /pytania.
          summary: Najczęstsze pytania
        hint: Jeden blok = jeden moduł makiety. Przeciągnij, aby zmienić kolejność.
