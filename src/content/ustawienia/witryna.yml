# arthurozmowy.pl · ustawienia wspólne całej witryny
# Sveltia CMS: Ustawienia → Witryna. Stan treści: 11.11.2026 (makieta V2).
# Lista stron, przyciski, okienka, pakiety, dane firmy i stopka stoją tu raz i trafiają na wszystkie strony,
# więc brzmią wszędzie identycznie. Strony wybierają tylko, który przycisk pokazać.
# Wartości w nawiasach kwadratowych to zaślepki: strona z zaślepką nie wychodzi na arthurozmowy.pl.

marka:
  nazwa: arthurozmowy
  domena: https://arthurozmowy.pl
  jezyk: pl-PL
  # Definicja, słowo w słowo ta sama w odpowiedzi „Czym są arthurozmowy?”, w danych strukturalnych i w llms.txt (GEO).
  definicja: |-
    Arthurozmowy to regularne rozmowy telefoniczne z Arthurem – programem opartym na sztucznej inteligencji, stworzonym pod okiem ekspertki od komunikacji z osobami starszymi. Arthur rozmawia o sprawach swojej rozmówczyni według ściśle określonej metody, nie diagnozuje i nie zastępuje opieki.
  # Logo dwuwierszowe „Arthur / ozmowy” z gradientem (19.11.2026). Wektor bez obrazów w środku, przycięty do liter.
  logo:
    plik: /images/marka/arthur-logo.svg
    alt: arthurozmowy

# Belka górna każdej strony, od lewej: logo, przycisk „Menu”, linki z listy „linki”, przycisk „Zamów online”
# (to samo miejsce docelowe co wezwania.zakupowe) i „Panel klienta”.
# „Menu” otwiera jedną listę: po lewej dziewięć stron z nawigacja.strony (strona oglądana wyróżniona),
# po prawej rozdziały strony oglądanej albo tej, przy której kliknięto strzałkę. Na telefonie rozdziały rozwijają się pod stroną.
naglowek:
  menu: Menu
  # Menu to jedna lista: strony po lewej jako główny poziom, a rozdziały tylko pod stroną oglądaną albo wskazaną.
  # Nad rozdziałami stoi „Na stronie” i nazwa tej strony, np. „Na stronie Jak działa Arthur”.
  grupa_rozdzialy: Na stronie
  grupa_strony: Strony
  linki:
    - tekst: Cena
      adres: /#cena
    - tekst: Kontakt
      adres: /kontakt
  zakup: Zamów online
  panel_klienta: Panel klienta   # adres z firma.panel_klienta
  # Na telefonie przycisk „Porozmawiaj z Arthurem” jest paskiem przyklejonym do dołu ekranu (potwierdzone 11.11.2026).
  przycisk_staly: true

# Kolejność stron w menu i stopce. Zasada: jeden temat, jedna nazwa, jedno miejsce.
# Nazwę strony zmienia się tylko na stronie (pole „Nazwa strony”); menu, stopka i spis stron biorą ją stamtąd.
nawigacja:
  strony:
    - adres: /
    - adres: /o-nas
    - adres: /jak-dziala-arthur
    - adres: /jak-korzystac
    - adres: /jak-rozmawiac-z-mama
    - adres: /czego-nie-obiecujemy
    - adres: /bezpieczenstwo
    - adres: /pytania
    - adres: /kontakt
  # Link pod akordeonem „Najczęstsze pytania”, bez słowa „Więcej:” (jedyny link do strony o innej nazwie niż strona).
  wszystkie_pytania: Wszystkie pytania
  # Słowo przed linkiem wewnętrznym w treści, np. „Więcej: Jak działa Arthur”. Link jest tekstem, a nie przyciskiem.
  wiecej: "Więcej:"

# Trzy przyciski CTA witryny. Blok „wezwanie” na stronie wybiera jeden z nich po nazwie.
wezwania:
  glowne:
    # Otwiera okienko „Porozmawiaj z Arthurem” (okno_rozmowy).
    przycisk: Porozmawiaj z Arthurem
    # Objaśnienie pod przyciskiem pokazuje się tam, gdzie blok ma objasnienie: true.
    dopisek: Zostaw numer telefonu. Arthur oddzwoni do Ciebie za chwilę lub o wybranej przez Ciebie porze.
  zakupowe:
    # Jedna nazwa zakupu na całej witrynie (w tekstach z 11.11 były dwie: „Umów mamie próbne arthurozmowy”
    # i „Zamów dla mamy próbną arthurozmowę”). Prowadzi do zamówienia w panelu klienta.
    przycisk: Umów mamie próbne arthurozmowy
    adres: /umow               # zamówienie jeszcze nie istnieje: przycisk nieaktywny
  napisz:
    # Otwiera okienko „Napisz do nas” (okno_kontaktu).
    przycisk: Napisz do nas

# Okienko otwierane przyciskiem „Porozmawiaj z Arthurem”. Włączamy je dopiero po ocenie skutków
# dla ochrony danych (Z6), z polityką prywatności i decyzją, dokąd trafia numer i czy próbna rozmowa jest nagrywana.
okno_rozmowy:
  tytul: Porozmawiaj z Arthurem
  wstep: Arthur zadzwoni do Ciebie od razu albo o porze, którą wybierzesz. Porozmawiaj z nim o swoich sprawach, tak jak rozmawiać będzie z nim mama.
  pole_numer: Numer telefonu
  pytanie_kiedy: Kiedy Arthur ma zadzwonić?
  opcja_teraz: Teraz
  opcja_termin: Wybiorę dzień i godzinę
  pole_data: Data
  pole_godzina: Godzina
  przycisk: Zadzwoń do mnie
  potwierdzenie: Dziękujemy. Arthur zadzwoni do Ciebie za chwilę albo o porze, którą wybrałaś. Przedstawi się imieniem i nazwą usługi.
  blad: Nie udało się wysłać numeru. Sprawdź, czy jest wpisany w całości, i spróbuj jeszcze raz.
  # Dwie osobne zgody (decyzja z 20.11.2026, Regulamin usługi § 6): na telefon od Arthura i, osobno, nieobowiązkowo,
  # na jeden SMS po rozmowie z zaproszeniem do zamówienia. Przed włączeniem okienka sprawdza je ocena skutków (Z6).
  zgoda: Zgadzam się, żeby arthurozmowy zadzwoniły do mnie na podany numer. Wiem, że rozmowa nie jest nagrywana, a numer zostanie usunięty po 30 dniach. Szczegóły są w Polityce prywatności.
  zgoda_sms: Zgadzam się, żeby arthurozmowy wysłały mi po rozmowie jeden SMS z zaproszeniem do zamówienia. (nieobowiązkowe)

# Okienko otwierane przyciskiem „Napisz do nas” (nowe w makiecie V2). Teksty pól to propozycja do akceptacji.
# Włączamy je razem z okienkiem rozmowy, po ocenie skutków dla ochrony danych (Z6).
okno_kontaktu:
  tytul: Napisz do nas
  wstep: Napisz, w jakiej sprawie się odzywasz, i zostaw adres e-mail albo numer telefonu, a skontaktujemy się z Tobą.
  pole_imie: Imię
  pole_email: Adres e-mail
  pole_telefon: Numer telefonu (jeśli wolisz, żebyśmy zadzwonili)
  pole_wiadomosc: Twoja wiadomość
  przycisk: Wyślij wiadomość
  potwierdzenie: Dziękujemy za wiadomość. Odpowiemy w dni robocze, od poniedziałku do piątku.
  blad: Nie udało się wysłać wiadomości. Spróbuj jeszcze raz za chwilę.
  zgoda: Zgadzam się, żeby arthurozmowy użyły moich danych tylko do odpowiedzi na tę wiadomość. Szczegóły są w Polityce prywatności.

# Jedno źródło cen dla kart ceny na stronie głównej i na stronie Jak korzystać oraz dla danych strukturalnych (Offer).
# Jednostką jest tydzień (decyzja z 16.11.2026): pola liczbowe to liczba rozmów w tygodniu i muszą się zgadzać z polem „rytm”.
# Pole „opis” to liczby w miesiącu (4–5 tygodni), gotowy tekst karty, bo polska odmiana liczebników
# nie powinna zależeć od kodu szablonu. W miesiącu z pięcioma tygodniami mama ma pięć terminów bez dopłaty.
pakiety:
  waluta: PLN
  okres: miesięcznie, z VAT
  # Zdanie o długości rozmowy stoi na każdej karcie ceny. Pokazujemy długość jednej rozmowy, nigdy sumę minut.
  dlugosc: Rozmowa pełna trwa około 30 minut, a rozmowa podtrzymująca około 10 minut.
  lista:
    - cena: 279
      rozmowy_pelne: 1
      rozmowy_podtrzymujace: 0
      opis: 4–5 rozmów pełnych w miesiącu
      rytm: co tydzień 1 rozmowa pełna
      nazwa: pakiet ekonomiczny
      polecany: false
    - cena: 299
      rozmowy_pelne: 1
      rozmowy_podtrzymujace: 1
      opis: 4–5 rozmów pełnych i 4–5 rozmów podtrzymujących w miesiącu
      rytm: co tydzień 1 rozmowa pełna i 1 podtrzymująca
      nazwa: pakiet optymalny
      polecany: true
    - cena: 349
      rozmowy_pelne: 1
      rozmowy_podtrzymujace: 2
      opis: 4–5 rozmów pełnych i 8–10 rozmów podtrzymujących w miesiącu
      rytm: co tydzień 1 rozmowa pełna i 2 podtrzymujące
      nazwa: pakiet rozszerzony
      polecany: false

# Znaczniki w tekstach stron: {firma} = nazwa, ulica, kod i miejscowość, NIP; {email}, {telefon}, {godziny} = pola poniżej.
firma:
  nazwa: arthurozmowy Piotr Jaworski   # pisownię w regulaminie i na fakturach potwierdzić z CEIDG
  ulica: Kaliska 155G
  kod_pocztowy: 07-130
  miejscowosc: Łochów
  kraj: PL
  nip: 113 135 29 41
  email: kontakt@arthurozmowy.pl
  telefon: +48 519 199 606
  telefon_godziny: od poniedziałku do piątku w godzinach od 9:00 do 16:00
  panel_klienta: https://app.arthurozmowy.pl   # do potwierdzenia

autor:
  imie_nazwisko: Piotr Jaworski
  adres_strony: /o-nas

# Stopka od góry: trzy przyciski CTA, lista stron z nawigacja.strony, zdanie o plikach cookie,
# linia z danymi firmy i adresem e-mail, linki prawne i przycisk „Ustawienia plików cookie” (otwiera okienko zgód).
stopka:
  wezwania: [glowne, zakupowe, napisz]
  prywatnosc: Pliki cookie do statystyk i reklam zapisujemy tylko za Twoją zgodą.
  prawa: © 2026 arthurozmowy Piotr Jaworski, Kaliska 155G, 07-130 Łochów, NIP 113 135 29 41
  # Na adresie tymczasowym wszystkie cztery to strony „w przygotowaniu”.
  linki_prawne:
    - tekst: Regulamin strony
      adres: /regulamin-strony
    - tekst: Regulamin usługi
      adres: /regulamin-uslugi
    - tekst: Polityka prywatności i RODO
      adres: /prywatnosc
    - tekst: Pliki cookie
      adres: /pliki-cookie
  ustawienia_cookie: Ustawienia plików cookie

# Okienko zgód na pliki cookie (własne, decyzja z 19.11.2026): pokazuje się przy pierwszej wizycie i po przycisku
# w stopce. „Zgadzam się” i „Nie zgadzam się” wyglądają tak samo. Trzy kategorie są stałe w kodzie (Consent Mode v2):
# statystyki = analytics_storage, reklamy = ad_storage, ad_user_data, ad_personalization.
zgody:
  tytul: Pliki cookie
  tekst: |-
    Za Twoją zgodą zapiszemy pliki cookie Google i Meta. Pokażą nam, które strony są czytane i czy przyprowadziła Cię tu nasza reklama, żeby reklamy arthurozmów trafiały do osób, którym mogą się przydać. Bez zgody witryna działa tak samo, a decyzję zmienisz w każdej chwili w stopce. Szczegóły: [Pliki cookie](/pliki-cookie).
  przycisk_zgoda: Zgadzam się
  przycisk_odmowa: Nie zgadzam się
  przycisk_ustawienia: Ustawienia
  tytul_ustawien: Ustawienia plików cookie
  niezbedne: Niezbędne
  niezbedne_opis: Zapisują w przeglądarce Twoją decyzję w sprawie plików cookie, żeby okienko nie wracało na każdej stronie.
  zawsze: zawsze włączone
  statystyki: Statystyki
  statystyki_opis: Google Analytics pokazuje nam, które strony są czytane i skąd przychodzą odwiedzający. Dzięki temu wiemy, co na witrynie poprawić.
  reklamy: Reklamy
  reklamy_opis: Google Ads i Meta (Facebook, Instagram) sprawdzają, czy nasza reklama przyprowadziła Cię na witrynę, i mogą pokazywać Ci nasze reklamy na innych stronach.
  przycisk_zapisz: Zapisz wybór

# Pomiar i reklama (decyzja z 19.11.2026: GTM, GA4, okienko zgód z Consent Mode v2, licznik bez cookies;
# reklamy Google Ads i Meta). Puste pole = nic się nie ładuje. GA4 i piksele Google Ads i Meta ustawia się w GTM;
# uruchamiają się dopiero po zgodzie w okienku zgód. Licznik bez cookies działa bez zgody. Tylko na produkcji.
pomiar:
  gtm: ""
  licznik_skrypt: ""
  licznik_id: ""
