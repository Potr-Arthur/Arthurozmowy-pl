# arthurozmowy.pl · ustawienia wspólne całej witryny
# Sveltia CMS: Ustawienia → Witryna. Stan treści: 11.11.2026 (makieta V2).
# Lista stron, przyciski, okienka, pakiety, dane firmy i stopka stoją tu raz i trafiają na wszystkie strony,
# więc brzmią wszędzie identycznie. Strony wybierają tylko, który przycisk pokazać.
# Wartości w nawiasach kwadratowych to zaślepki: strona z zaślepką nie wychodzi na arthurozmowy.pl.

marka:
  nazwa: arthurozmowy
  domena: https://arthurozmowy.pl
  jezyk: pl-PL
  # Definicja, słowo w słowo ta sama w odpowiedzi „Czym są arthurozmowy?”, w danych strukturalnych i w llms.txt (GEO).
  definicja: |-
    Arthurozmowy to regularne rozmowy telefoniczne z Arthurem – programem opartym na sztucznej inteligencji, stworzonym pod okiem ekspertki od komunikacji z osobami starszymi. Arthur rozmawia o sprawach swojej rozmówczyni według ściśle określonej metody, nie diagnozuje i nie zastępuje opieki.
  logo:
    plik: /images/marka/arthur-logo.svg
    alt: Arthur

# Belka górna każdej strony, od lewej: logo, przycisk „Menu”, linki z listy „linki”, przycisk „Zamów online”
# (to samo miejsce docelowe co wezwania.zakupowe) i „Panel klienta”.
# „Menu” otwiera panel z dwiema grupami: „Na tej stronie” (rozdziały oglądanej strony)
# i „Pozostałe strony” (osiem stron z nawigacja.strony, każda jako przycisk „Link wewnętrzny”; strona oglądana jest oznaczona i nieklikalna).
naglowek:
  menu: Menu
  grupa_rozdzialy: Na tej stronie
  grupa_strony: Pozostałe strony
  linki:
    - tekst: Cena
      adres: /#cena
    - tekst: Kontakt
      adres: /kontakt
  zakup: Zamów online
  panel_klienta: Panel klienta   # adres z firma.panel_klienta
  # Na telefonie przycisk „Porozmawiaj z Arthurem” jest paskiem przyklejonym do dołu ekranu (potwierdzone 11.11.2026).
  przycisk_staly: true

# Jedna lista stron dla menu i stopki. Zasada: jeden temat, jedna nazwa, jedno miejsce.
# Nazwa strony brzmi tak samo w menu, w stopce, w przyciskach „Link wewnętrzny” i w spisie treści strony głównej.
nawigacja:
  strony:
    - tekst: Jej sprawy
      adres: /
    - tekst: O nas
      adres: /o-nas
    - tekst: Jak działa Arthur
      adres: /jak-dziala-arthur
    - tekst: Jak korzystać
      adres: /jak-korzystac
    - tekst: Jak rozmawiać z mamą
      adres: /jak-rozmawiac-z-mama
    - tekst: Czego nie obiecujemy
      adres: /czego-nie-obiecujemy
    - tekst: Pytania
      adres: /pytania
    - tekst: Kontakt
      adres: /kontakt
  # Napis na przycisku pod akordeonem „Najczęstsze pytania” (jedyny link do strony o innej nazwie niż strona).
  wszystkie_pytania: Wszystkie pytania

# Trzy przyciski CTA witryny. Blok „wezwanie” na stronie wybiera jeden z nich po nazwie.
wezwania:
  glowne:
    # Otwiera okienko „Porozmawiaj z Arthurem” (okno_rozmowy).
    przycisk: Porozmawiaj z Arthurem
    # Objaśnienie pod przyciskiem pokazuje się tam, gdzie blok ma objasnienie: true.
    dopisek: Zostaw numer telefonu. Arthur oddzwoni do Ciebie za chwilę lub o wybranej przez Ciebie porze.
  zakupowe:
    # Jedna nazwa zakupu na całej witrynie (w tekstach z 11.11 były dwie: „Umów mamie próbne arthurozmowy”
    # i „Zamów dla mamy próbną arthurozmowę”). Prowadzi do zamówienia w panelu klienta.
    przycisk: Umów mamie próbne arthurozmowy
    adres: /umow               # zamówienie jeszcze nie istnieje: przycisk nieaktywny
  napisz:
    # Otwiera okienko „Napisz do nas” (okno_kontaktu).
    przycisk: Napisz do nas

# Okienko otwierane przyciskiem „Porozmawiaj z Arthurem”. Włączamy je dopiero po ocenie skutków
# dla ochrony danych (Z6), z polityką prywatności i decyzją, dokąd trafia numer i czy próbna rozmowa jest nagrywana.
okno_rozmowy:
  tytul: Porozmawiaj z Arthurem
  wstep: Arthur zadzwoni do Ciebie od razu albo o porze, którą wybierzesz. Porozmawiaj z nim o swoich sprawach, tak jak rozmawiać będzie z nim mama.
  pole_numer: Numer telefonu
  pytanie_kiedy: Kiedy Arthur ma zadzwonić?
  opcja_teraz: Teraz
  opcja_termin: Wybiorę dzień i godzinę
  pole_data: Data
  pole_godzina: Godzina
  przycisk: Zadzwoń do mnie
  potwierdzenie: "[do napisania]"
  blad: "[do napisania]"
  zgoda: "[do napisania po ocenie skutków dla ochrony danych (Z6)]"

# Okienko otwierane przyciskiem „Napisz do nas” (nowe w makiecie V2). Teksty pól to propozycja do akceptacji.
# Włączamy je razem z okienkiem rozmowy, po ocenie skutków dla ochrony danych (Z6).
okno_kontaktu:
  tytul: Napisz do nas
  wstep: Napisz, w jakiej sprawie się odzywasz, i zostaw adres e-mail albo numer telefonu, a skontaktujemy się z Tobą.
  pole_imie: Imię
  pole_email: Adres e-mail
  pole_telefon: Numer telefonu (jeśli wolisz, żebyśmy zadzwonili)
  pole_wiadomosc: Twoja wiadomość
  przycisk: Wyślij wiadomość
  potwierdzenie: "[do napisania]"
  blad: "[do napisania]"
  zgoda: "[do napisania po ocenie skutków dla ochrony danych (Z6)]"

# Jedno źródło cen dla kart ceny na stronie głównej i na stronie Jak korzystać oraz dla danych strukturalnych (Offer).
# Pole „opis” to gotowy tekst karty, bo polska odmiana liczebników („4 rozmowy”, „6 rozmów”)
# nie powinna zależeć od kodu szablonu. Liczby w polach liczbowych muszą się zgadzać z opisem.
pakiety:
  waluta: PLN
  okres: miesięcznie, z VAT
  lista:
    - cena: 279
      rozmowy_pelne: 4
      rozmowy_podtrzymujace: 8
      opis: 4 rozmowy pełne i 8 rozmów podtrzymujących
      nazwa: pakiet ekonomiczny
      polecany: false
    - cena: 299
      rozmowy_pelne: 6
      rozmowy_podtrzymujace: 8
      opis: 6 rozmów pełnych i 8 rozmów podtrzymujących
      nazwa: pakiet optymalny
      polecany: true
    - cena: 349
      rozmowy_pelne: 8
      rozmowy_podtrzymujace: 12
      opis: 8 rozmów pełnych i 12 rozmów podtrzymujących
      nazwa: pakiet rozszerzony
      polecany: false

# Znaczniki w tekstach stron: {firma} = nazwa, ulica, kod i miejscowość, NIP; {email}, {telefon}, {godziny} = pola poniżej.
firma:
  nazwa: arthurozmowy Piotr Jaworski   # pisownię w regulaminie i na fakturach potwierdzić z CEIDG
  ulica: Kaliska 155G
  kod_pocztowy: 07-130
  miejscowosc: Łochów
  kraj: PL
  nip: 113 135 29 41
  email: kontakt@arthurozmowy.pl
  telefon: +48 519 199 606
  telefon_godziny: od poniedziałku do piątku w godzinach od 9:00 do 16:00
  panel_klienta: https://app.arthurozmowy.pl   # do potwierdzenia

autor:
  imie_nazwisko: Piotr Jaworski
  adres_strony: /o-nas

# Stopka od góry: trzy przyciski CTA, lista stron z nawigacja.strony, zdanie o statystykach,
# linia z danymi firmy i adresem e-mail, linki prawne.
stopka:
  wezwania: [glowne, zakupowe, napisz]
  prywatnosc: Statystyki strony zbieramy bez plików cookies.
  prawa: © 2026 arthurozmowy Piotr Jaworski, Kaliska 155G, 07-130 Łochów, NIP 113 135 29 41
  # Na adresie tymczasowym wszystkie trzy to strony „w przygotowaniu”.
  linki_prawne:
    - tekst: Regulamin strony
      adres: /regulamin-strony
    - tekst: Regulamin usługi
      adres: /regulamin-uslugi
    - tekst: Polityka prywatności i RODO
      adres: /prywatnosc
