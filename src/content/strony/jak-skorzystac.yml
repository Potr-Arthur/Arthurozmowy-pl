# arthurozmowy.pl · Jak skorzystać
# Sveltia CMS: Strony → Jak skorzystać. Stan treści: 4.11.2026 (jeden temat, jedna nazwa).
# Nowa podstrona z 30.10.2026 (R175). W prototypie jej jeszcze nie ma, więc układ i tony to moja propozycja
# w szablonie podstrony: Hero2, rozdziały t2/t1, cennik z ustawień wspólnych, akordeon i pas wezwań (t5).
# Strona należy do strefy pieniężnej, więc nie ma na niej słów zakazanych nawet w cytacie.

strona:
  nazwa: Jak skorzystać
  szablon: podstrona

seo:
  adres: /jak-skorzystac
  tytul: Jak skorzystać z arthurozmów – umowa, płatności i rezygnacja
  opis: |-
    Umowę na arthurozmowy, czyli rozmowy telefoniczne z Arthurem, zawierasz online. Zobacz pakiety, płatności, rezygnację z opcją „Pożegnanie” i zasady Arthura.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [WebPage, Offer, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-04

geo:
  streszczenie: |-
    Umowę abonamentową na arthurozmowy zawiera online dorosłe dziecko, nie mama, na czas nieokreślony i dopiero po zgodzie mamy. Pierwszy miesiąc jest próbny i bezpłatny, potem opłata (279, 299 albo 349 zł miesięcznie z VAT) odnawia się co miesiąc, a rezygnacja jednym kliknięciem uruchamia 15-dniowe „Pożegnanie” z rozliczeniem proporcjonalnym. Arthur nigdy nie prosi mamy o pieniądze, dane ani o zachowanie czegoś w tajemnicy przed rodziną.

wejscie:
  h1: |-
    Formalności online są po Twojej stronie. Rozmowy należą do mamy.
  h1_wyroznienie: ""
  lid: |-
    Arthurozmowy zamawiasz i opłacasz Ty, a mama decyduje o tym, czy, kiedy i o czym rozmawia przez telefon z Arthurem – programem opartym na sztucznej inteligencji. Piszemy tu, jak zawrzeć umowę, ile i kiedy płacisz, jak zrezygnować i jakich zasad Arthur trzyma się w rozmowach z mamą.
  zdjecie:
    widoczne: true
    plik_desktop: /images/strony/arthurozmowy-jak-skorzystac-mama-w-fotelu-desk.webp
    plik_telefon: /images/strony/arthurozmowy-jak-skorzystac-mama-w-fotelu-tel.webp
    alt: Mama o siwych włosach rozmawia przez telefon w fotelu, a w tle córka pracuje przy laptopie
    kadr: Decyzja z 5.11.2026, prompt H – dwa plany, na pierwszym mama w fotelu przy telefonie, uśmiechnięta i odprężona; w tle, w nieostrości, córka przy stole z laptopem (bez ekranu i logo). Ilustruje H1 „Formalności online są po Twojej stronie. Rozmowy należą do mamy”.
  wezwania:
    glowne: false
    dopisek: false
    jawnosc: false
    zakupowe: false
    nad_zakupowym: false
  pokaz_autora_i_date: true

sekcje:
  - typ: rozdzial
    kotwica: abonament
    etykieta: Abonament
    ton: t2
    h2: |-
      Umowę abonamentową zawierasz z nami online, a rezygnujesz, kiedy chcesz.
    tekst: |-
      Zamówienie składasz dopiero wtedy, gdy mama zgodzi się na rozmowy z Arthurem, bo bez jej zgody nie będą możliwe. Wybierasz pakiet, podajesz numer telefonu mamy i akceptujesz regulamin. Umowa nie wiąże Cię na żaden określony czas, więc z usługi zrezygnujesz w każdej chwili.

      Pierwszy, próbny miesiąc jest za darmo i do niczego nie zobowiązuje. Płacisz dopiero od drugiego miesiąca, gdy potwierdzisz, że kontynuujecie rozmowy, a od tej pory opłata odnawia się co miesiąc, chyba że zdecydujesz inaczej.

      W panelu klienta zobaczysz raporty i płatności, zmienisz dane i pakiet, a także zrezygnujesz jednym kliknięciem. Sprawy abonamentu i płatności załatwiamy wyłącznie z Tobą, więc Arthur nigdy nie rozmawia z mamą o pieniądzach.
    linki:
      - tekst: Jak rozmawiać z mamą
        adres: /jak-rozmawiac-z-mama
        aktywny: true

  # Blok 3 · rozdział, 7 · cennik z ustawień wspólnych (z nazwami pakietów)
  - typ: rozdzial
    kotwica: cena
    etykieta: Cena
    ton: t1
    h2: |-
      Pakiety nie różnią się jakością, a wyłącznie liczbą rozmów w miesiącu.
    tekst: |-
      W każdym pakiecie Arthur rozmawia z mamą według tej samej eksperckiej metody, a Ty dostajesz taki sam raport. Pakiety różnią się liczbą rozmów pełnych i podtrzymujących, które mama ma do dyspozycji w miesiącu:
    cennik:
      widoczny: true
      pokaz_nazwy: true
    tekst_po: |-
      Na początek proponujemy pakiet optymalny za 299 zł. Ceny zawierają VAT. Pakiet zmienisz na wyższy albo niższy od kolejnego miesiąca i nigdy nie będzie to problemem.

  - typ: rozdzial
    kotwica: rezygnacja
    etykieta: Rezygnacja
    ton: t2
    h2: |-
      Zrezygnujesz jednym kliknięciem, a Arthur pożegna się z mamą w ciągu 15 dni.
    tekst: |-
      Rezygnacja w panelu klienta uruchamia opcję „Pożegnanie”. Arthur nie przerwie rozmów z dnia na dzień, bo mama ma prawo wiedzieć zawczasu, że skończą się rozmowy, które polubiła. Przez 15 kolejnych dni zmieni w rozmowach narrację i treść, a w ostatniej rozmowie się z nią pożegna.

      Rozliczenie opcji „Pożegnanie” jest proporcjonalne do pozostałego czasu abonamentu. Nie dotyczy ona miesiąca próbnego: jeśli zrezygnujesz w nim, rozmowy po prostu się kończą.

  # Rozdział według kanału wybranego na pilotaż 23.10.2026 (zwykły telefon, bez hasła). Kanał docelowy: Z14.
  - typ: rozdzial
    kotwica: bezpieczenstwo
    etykieta: Bezpieczeństwo
    ton: t1
    h2: |-
      Arthur tylko rozmawia. O pieniądze ani dane nigdy mamy nie zapyta.
    tekst: |-
      Arthur nigdy nie prosi mamy o pieniądze ani o dane, takie jak numer karty czy PESEL. Nie prosi, żeby kogoś wpuściła, coś podpisała albo gdzieś poszła, i nigdy nie prosi, żeby czegoś nie mówiła rodzinie. Nigdy też nie przekazuje informacji o członkach rodziny ani wiadomości od innych osób.

      Arthur dzwoni zawsze z tego samego numeru, który podamy Ci przed pierwszą rozmową, żebyś zapisała go w telefonie mamy. Sam numer na ekranie nie daje jednak pewności, bo oszuści potrafią go podrobić. Dlatego przy każdej wątpliwości mama może się rozłączyć i zadzwonić do Ciebie, a gdy zapyta Arthura, czy to nie oszustwo, Arthur doceni jej czujność i podpowie, żeby zapytała Ciebie.

      Powiedz o tym mamie, zanim Arthur zadzwoni do niej po raz pierwszy, i uczul ją, że ktoś, kto przedstawia się jako Arthur i czegoś od niej chce, nie jest Arthurem.
    zdjecie:
      widoczne: true
      plik_desktop: /images/strony/arthurozmowy-jak-skorzystac-mama-czujna-desk.webp
      plik_telefon: /images/strony/arthurozmowy-jak-skorzystac-mama-czujna-tel.webp
      alt: Mama o siwych włosach, z założonymi rękami, patrzy prosto w obiektyw z czujnym, lekkim uśmiechem
      kadr: Propozycja z 5.11.2026, prompt I – mama z sesji przy stole, ręce założone, uniesiona brew, lekki uśmiech osoby, której nie da się nabrać. Bez telefonu.
    linki:
      - tekst: Uprzedź o oszustach
        adres: /jak-rozmawiac-z-mama#uprzedz-o-oszustach
        aktywny: true

  # Blok 19 · trzy pytania w akordeonie (propozycja wyboru)
  - typ: faq
    kotwica: najczestsze-pytania
    ton: t2
    h2: Najczęstsze pytania
    pytania: [zgoda-mamy, czego-mama-potrzebuje, czy-dowiem-sie-o-czym-rozmawiaja]
    linki:
      - tekst: Wszystkie pytania
        adres: /pytania
        aktywny: true

  - typ: koniec
    ton: t5
    linki:
      - tekst: Pytania
        adres: /pytania
        aktywny: true
      - tekst: Czego nie obiecujemy
        adres: /czego-nie-obiecujemy
        aktywny: true
    wezwania:
      glowne: true
      dopisek: false
      jawnosc: false
      zakupowe: true
      nad_zakupowym: true
