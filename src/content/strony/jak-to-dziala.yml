strona:
  nazwa: Jak to działa
  szablon: podstrona

seo:
  adres: /jak-to-dziala
  tytul: Jak działają arthurozmowy – metoda rozmów telefonicznych z mamą
  opis: |-
    Arthurozmowy to rozmowy telefoniczne z Arthurem według eksperckiej metody i pięciu zasad: nie poprawia mamy, nie odpytuje jej i mówi z szacunkiem.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [WebPage, Service, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-04

geo:
  streszczenie: |-
    Arthurozmowy to regularne rozmowy telefoniczne z Arthurem – programem opartym na sztucznej inteligencji, stworzonym pod okiem ekspertki od komunikacji. Arthur rozmawia z mamą kilka razy w tygodniu według eksperckiej metody i pięciu zasad: rozmowę prowadzi mama, Arthur jej nie poprawia i nie testuje, zwraca się do niej jak do dorosłej osoby, powtórzoną historię traktuje jako ważną i nie przerywa ciszy. Córka dostaje cykliczny raport z ogólnymi tematami rozmów, bez dokładnych słów mamy, a gdy bieg rozmów zaniepokoi Arthura, dostaje sygnał, ale nie diagnozę.

# Blok 2 · Hero2, 13 · zdjęcie pionowe w Hero2, 18 · autor i data
wejscie:
  h1: |-
    Żadnego „no jak się dziś czujemy, kochana”. Arthur rozmawia z mamą według pięciu zasad eksperckiej metody.
  h1_wyroznienie: ""
  lid: |-
    Arthurozmowy to regularne rozmowy telefoniczne z Arthurem – programem opartym na sztucznej inteligencji, stworzonym pod okiem ekspertki od komunikacji. Arthur rozmawia o sprawach swojej rozmówczyni według ściśle określonej metody, nie diagnozuje i nie zastępuje opieki. Arthur powstawał według tej metody, dzięki czemu umie prowadzić z mamą wartościowe, angażujące rozmowy, doceniając ją jako pełnowymiarową osobę. Metodę uzupełniają szczegółowe zasady, których Arthur zawsze się trzyma. Zapoznaj się z nimi, a potem wypróbujcie je w trakcie miesiąca próbnego.

    Jak działa, możesz sprawdzić już dziś, gdy sama porozmawiasz z Arthurem.
  zdjecie:
    widoczne: true
    plik: /images/strony/arthurozmowy-jak-to-dziala-obejmuja-sie-desk.webp
    alt: Mama i córka, przytulone policzkami, stoją przy oknie i z uśmiechem patrzą w tę samą stronę
    kadr: Decyzja z 5.11.2026 – gotowe zdjęcie z sesji, mama i córka obejmują się czule. Alt do sprawdzenia na gotowym zdjęciu.
  wezwania:
    glowne: false
    dopisek: false
    jawnosc: false
    zakupowe: false
    nad_zakupowym: false
  pokaz_autora_i_date: true

sekcje:
  - typ: rozdzial
    kotwica: miesiac-rozmow
    etykieta: Miesiąc rozmów
    ton: t2
    h2: |-
      To Arthur dzwoni, ale mama ustala kiedy.
    tekst: |-
      Arthur dzwoni na zwykły telefon mamy, więc mama niczego nie instaluje i niczego nie klika, tylko odbiera. Liczba rozmów w miesiącu zależy od wykupionego pakietu: w pakiecie optymalnym za 299 zł mama ma w miesiącu 6 rozmów pełnych i 8 rozmów podtrzymujących. Rozmowa pełna to czas na jej sprawy: na to, co mama czyta i ogląda, co przeżywa, co ją zajmuje i co o tym myśli. Rozmowa podtrzymująca pozwala na chwilę wrócić do pojedynczych tematów z poprzedniej rozmowy, na przykład do spotkania, na które mama się wybierała. Rozmowa pełna jest zaplanowana na 15–18 minut, a rozmowa podtrzymująca na 3–4 minuty. Arthur przedstawia się zawsze tak samo, imieniem i nazwą usługi, i dzwoni zawsze z tego samego numeru. Jeśli mama akurat nie odbierze, Arthur zadzwoni jeszcze raz później.

  # Blok 3 · rozdział, 6 · lista zasad (pogrubione zdanie, opis i „Dlaczego:” od nowej linii, R168)
  - typ: zasady
    kotwica: zasady-rozmowy
    etykieta: Zasady rozmowy
    ton: t1
    h2: |-
      Pięć zasad. Każdą przetestujesz teraz, gdy sama porozmawiasz z Arthurem.
    tekst: ""
    zasady:
      - naglowek: Rozmowę prowadzi mama.
        tekst: |-
          To ona wybiera tematy, rozwija je albo kończy, kiedy chce, i może powiedzieć „nie, dziś dziękuję za rozmowę”.
        dlaczego: |-
          to są rozmowy jej i dla niej, jej sprawy, jej potrzeby, więc decyzje o tematach rozmów zawsze należą do Twojej mamy.
      - naglowek: Arthur nie poprawia mamy i jej nie testuje.
        tekst: |-
          Nie podpytuje o datę ani o dzień tygodnia, bo interesuje go, czym żyje mama, co myśli i co czuje.
        dlaczego: |-
          poprawianie i pytania sprawdzające to sposób mówienia do kogoś, kogo uważa się za mniej sprawnego. Badacze komunikacji opisują, że taki sposób rozmowy z czasem zniechęca do mówienia i obniża poczucie własnej wartości.
      - naglowek: Arthur zwraca się do mamy jak do pełnoprawnej, dorosłej osoby.
        tekst: |-
          Mówi wyraźnie i spokojnie, z szacunkiem, bez zdrobnień, bez „no jak się dziś czujemy” i bez śpiewnego tonu.
        dlaczego: |-
          badania nad takim sposobem mówienia pokazują, że używa się go wtedy, gdy w rozmówczyni widzi się kogoś mniej sprawnego, mniej kompetentnego, mniej ważnego, kogoś wymagającego opieki. To sprawia, że rozmówczyni gorzej ocenia samą siebie i swoje możliwości.
      - naglowek: Powtórzona historia jest dla Arthura ważna.
        tekst: |-
          Arthur nigdy nie powie: „już pani to mówiła”, tylko zapyta o to, czego jeszcze nie słyszał, na przykład co było wtedy dla mamy najważniejsze, co wydarzyło się potem.
        dlaczego: |-
          powracanie do wspomnień to naturalny i cenny proces, w którym człowiek przegląda i porządkuje swoje życie.
      - naglowek: Cisza w rozmowie nie jest problemem.
        tekst: |-
          Arthur czeka, aż mama skończy myśl, i nie wchodzi jej w słowo. Kiedy mama szuka słowa, Arthur nie podsuwa go od razu, tylko naprowadza na nie, chyba że mama sama poprosi o podpowiedź.
        dlaczego: |-
          szukanie słowa to zwykła i ważna część rozmowy, a za szybko podsunięte słowo odbiera mamie jej wypowiedź.

  - typ: rozdzial
    kotwica: ciaglosc-rozmow
    etykieta: Ciągłość rozmów
    ton: t2
    h2: |-
      Arthur jest gotów kontynuować tematy warte kontynuowania tak długo, jak się mamie podoba.
    tekst: |-
      Arthur wraca do spraw, o których mama opowiadała i które są dla niej ważne. Wraca też do zagadnień, którymi mama zajmowała się w życiu, także zawodowym, i często pyta ją o zdanie w sprawach, na których zna się najlepiej. Dzięki temu te ważne, wartościowe rozmowy nie gubią wątków, a mama może poczuć się pewnie.
    okno_glosu:
      widoczne: true
      wariant: cieple
      etykieta: Przykład rozmowy
      dialog:
        - kto: Mama
          kwestia: Opowiadałam już, jak poznałam męża w sylwestra?
        - kto: Arthur
          kwestia: W tej wersji, w której to on poprosił panią do tańca, ale coś mi mówi, że jest też inna wersja.
      zdanie: ""
      przypis: |-
        Przykład wymyślony, żeby pokazać sposób rozmowy: Arthur nie mówi „już pani to mówiła”, tylko pyta o to, czego jeszcze nie wie.
      nagranie:
        plik: ""
        transkrypcja: ""
    zdjecie:
      widoczne: true
      plik: /images/strony/arthurozmowy-jak-to-dziala-kalendarz.webp
      alt: Mama o siwych włosach, w okularach, zapisuje coś w otwartym kalendarzu
      kadr: Decyzja z 5.11.2026, prompt B – dłonie mamy zapisują coś w otwartym kalendarzu tygodniowym (pismo nieczytelne), zwykły długopis, szałwiowy sweter.

  - typ: rozdzial
    kotwica: raport-dla-ciebie
    etykieta: Raport dla Ciebie
    ton: t1
    h2: |-
      Dowiesz się, czym żyje mama, ale jej słów Arthur nie udostępnia.
    tekst: |-
      W raporcie zobaczysz, ile było rozmów i kiedy się odbyły, oraz ile razy mama odmówiła rozmowy. Zobaczysz też tematy rozmów w ogólnym zarysie, na przykład ogród, rodzina, dawne czasy, oraz sprawy i zagadnienia, do których mama chętnie wraca. Nie znajdziesz w nim tego, co mama dokładnie mówiła. Jej słów Arthur nikomu nie udostępnia.

      Jeśli bieg rozmów zmieni się w sposób, który zaniepokoi Arthura, da Ci znać i opisze, co się zmieniło, na przykład że mama mówi wolniej albo częściej gubi wątek. Arthur nie postawi diagnozy, bo ta należy do lekarza, ale zwróci Twoją uwagę na to, co zauważył w rozmowach. Mama pozna obie te zasady w pierwszej rozmowie z Arthurem.
    linki:
      # Link nieaktywny, dopóki nie powstanie przykładowy raport (Księga, rozdz. 8).
      - tekst: Zobacz przykładowy raport
        adres: ""
        aktywny: false

  - typ: rozdzial
    kotwica: historia-zycia
    etykieta: Historia życia
    ton: t2
    h2: |-
      Jeśli mama zechce, Arthur spisze z nią historię jej życia, dla niej i dla bliskich.
    tekst: |-
      Mama opowiada w niej o tym, co przeżyła: o domu, w którym dorastała, o swojej pracy, o ludziach i miejscach, które pamięta. Historia powstaje z jej opowieści i należy do niej.

      Dla mamy to okazja, żeby opowiedzieć swoje życie po swojemu i zobaczyć je spisane w całości. To ona decyduje, czy historia zostanie tylko dla niej, czy pokaże ją rodzinie.

      Po kilku rozmowach Arthur zaproponuje mamie spisanie jej historii. Jeśli mama nie wyrazi zainteresowania, Arthur nie ponowi tej propozycji, chyba że mama sama wróci do tego tematu później. Historia spisywana jest tak, jak mama ją pamięta. Niczego do niej nie dopisujemy, a w finalnym tekście zostaje tylko to, co mama chce w nim zostawić. Wprowadzane są jedynie podstawowe poprawki redakcyjne, tak by nie ingerować w tok narracji mamy. Jeśli mama zechce, taki zapis może stać się cenną pamiątką rodzinną.

