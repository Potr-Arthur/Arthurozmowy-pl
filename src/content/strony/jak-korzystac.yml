# arthurozmowy.pl · Jak korzystać
# Sveltia CMS: Strony → Jak korzystać. Stan treści: 11.11.2026 (makieta V2).
# Dawniej „Jak skorzystać” (/jak-skorzystac): stary adres przekierowuje tutaj.
# Strona należy do strefy pieniężnej, więc nie ma na niej słów zakazanych nawet w cytacie.

strona:
  nazwa: Jak korzystać
  szablon: podstrona

seo:
  adres: /jak-korzystac
  tytul: Jak korzystać z arthurozmów – abonament, cena i rezygnacja
  opis: |-
    Arthurozmowy zamawiasz online, gdy mama się zgodzi. Pierwsze 14 dni są bezpłatne, potem płacisz 279, 299 albo 349 zł i rezygnujesz w panelu klienta.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [WebPage, Offer, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-20

geo:
  streszczenie: |-
    Umowę abonamentową na arthurozmowy zawiera online osoba dorosła, zwykle córka albo syn, a nie mama, na czas nieokreślony i dopiero po zgodzie mamy. Przy zamówieniu podaje stały dzień i godzinę rozmów wybrane przez mamę, a termin można bezpłatnie zmienić od następnego tygodnia. Pierwsze 14 dni są próbne i bezpłatne, potem opłata (279, 299 albo 349 zł miesięcznie z VAT) odnawia się co miesiąc, a pakiet można zmienić od kolejnego miesiąca. Rezygnacja w panelu klienta (kliknięcie i potwierdzenie) uruchamia 15-dniowe „Pożegnanie”, rozliczane z dniami już opłaconymi. Arthur nigdy nie prosi mamy o pieniądze, dane ani o zachowanie czegoś w tajemnicy przed rodziną.

wejscie:
  h1: |-
    Formalności online są po Twojej stronie. Rozmowy należą do mamy.
  zdjecie:
    widoczne: true
    plik: /images/strony/arthurozmowy-jak-korzystac-mama-corka-przy-laptopie-1x1.webp
    alt: Córka w okularach ustawia coś na laptopie, a mama o siwych włosach z uśmiechem patrzy na ekran
  lid: |-
    Arthurozmowy zamawiasz i opłacasz Ty, a mama decyduje o tym, kiedy i o czym rozmawia przez telefon z Arthurem – programem opartym na sztucznej inteligencji. Piszemy tu, jak zawrzeć umowę, ile i kiedy zapłacisz, jak zrezygnować i jakich zasad Arthur trzyma się w rozmowach z mamą.
  bloki: []

sekcje:
  - kotwica: abonament
    etykieta: Abonament
    ton: t2
    h2: |-
      Umowę abonamentową zawierasz z nami online, a rezygnujesz, kiedy chcesz.
    lid: |-
      Zamówienie składasz dopiero wtedy, gdy mama zgodzi się na rozmowy z Arthurem, bo bez jej zgody nie będą możliwe. Wybierasz pakiet, podajesz numer telefonu mamy oraz dzień i godzinę rozmów, które wybrała, potwierdzasz jej zgodę i akceptujesz regulamin. Danych karty przy zamówieniu nie podajesz.
    bloki:
      - typ: tekst
        tekst: |-
          Umowa nie wiąże Cię na żaden określony czas, więc z usługi łatwo możesz zrezygnować. Pierwsza rozmowa odbędzie się w ciągu kilku dni od zamówienia, w terminie wybranym przez mamę.

          Pierwsze 14 dni są za darmo i do niczego nie zobowiązują. Trzy dni przed ich końcem zapytamy Cię, czy kontynuujecie, i wyślemy link do płatności. Płacisz dopiero wtedy, gdy to potwierdzisz, a potem opłata odnawia się automatycznie co miesiąc, chyba że zrezygnujesz z abonamentu. Bez płatności rozmowy po prostu się kończą.

          Raport z rozmów przychodzi do Ciebie co tydzień e-mailem. W panelu klienta zobaczysz faktury, zmienisz kartę albo pakiet na kolejny miesiąc i zrezygnujesz: klikasz i potwierdzasz. Sprawy abonamentu i płatności załatwiamy wyłącznie z Tobą, więc Arthur nigdy nie rozmawia z mamą o pieniądzach.

          Gdy termin rozmów przestanie mamie pasować, zgłoś nowy w Biurze Obsługi albo odpowiadając na naszą wiadomość. Zmiana jest bezpłatna, bez limitu i obowiązuje od następnego tygodnia. Jeśli mama wyjeżdża albo jest w szpitalu i nie chce w tym czasie rozmawiać, rozmowy można zawiesić. Zgłaszasz to Ty albo mama w Biurze Obsługi. Za każdy dzień zawieszenia obniżamy następną opłatę, ale najwyżej za 7 dni.
      - typ: link
        tekst: Jak rozmawiać z mamą
        adres: /jak-rozmawiac-z-mama
        aktywny: true

  - kotwica: cena
    etykieta: Cena
    ton: t5
    h2: |-
      Pakiety nie różnią się jakością, a wyłącznie liczbą rozmów w tygodniu.
    lid: |-
      W każdym pakiecie Arthur rozmawia z mamą według tej samej eksperckiej metody, a Ty dostajesz taki sam raport.
    bloki:
      - typ: tekst
        tekst: |-
          Na cenę składają się dwie rzeczy: liczba rozmów w tygodniu i długość jednej rozmowy. Rozmowa pełna trwa około 30 minut, a rozmowa podtrzymująca około 10 minut, tak samo w każdym pakiecie. W każdym pakiecie mama ma co tydzień rozmowę pełną w stałym terminie, a pakiety różnią się liczbą rozmów podtrzymujących:
      # Karty ceny: trzy pakiety z Ustawień → Pakiety i ceny.
      - typ: cennik
      - typ: tekst
        tekst: |-
          Liczymy tygodnie, a nie miesiące: w miesiącu, w którym jest pięć tygodni, mama ma pięć terminów rozmów, a opłata się nie zmienia.
      - typ: glos
        tekst: |-
          Na początek proponujemy pakiet optymalny za 299 zł. Ceny zawierają VAT. Pakiet zmienisz na wyższy albo niższy od kolejnego miesiąca – nigdy nie będzie to problemem.

  - kotwica: rezygnacja
    etykieta: Rezygnacja
    ton: t2
    h2: |-
      Zrezygnujesz w panelu klienta, a Arthur pożegna się z mamą w ciągu 15 dni.
    zdjecie:
      widoczne: true
      plik: /images/strony/arthurozmowy-jak-korzystac-mama-po-rozmowie-4x3.webp
      alt: Mama o siwych włosach siedzi w fotelu z telefonem w dłoni i z lekkim uśmiechem patrzy przed siebie
    lid: |-
      Rezygnację klikasz w panelu klienta i potwierdzasz, bez dzwonienia i pisania do nas. Uruchamia ona opcję „Pożegnanie”. Arthur nie przerwie rozmów z dnia na dzień, bo mama ma prawo przygotować się do zakończenia rozmów, szczególnie jeśli je polubiła.
    bloki:
      - typ: tekst
        tekst: |-
          Przez 15 kolejnych dni Arthur dzwoni do mamy w jej stałym terminie. W pierwszej z tych rozmów powie jej spokojnie, kiedy rozmowy się skończą, a w ostatniej pożegna się z nią.

          Za „Pożegnanie” płacisz tyle, ile za 15 dni Twojego pakietu. Dni, które już opłaciłaś, przechodzą na „Pożegnanie”: jeśli zostało ich więcej, nadwyżkę zwracamy, a jeśli mniej, brakujące dni dopłacasz w ostatniej fakturze. „Pożegnanie” nie dotyczy okresu próbnego: jeśli zrezygnujesz w jego trakcie, rozmowy po prostu się zakończą.

          Gdy płatność za kolejny miesiąc się nie uda, wyślemy Ci link do płatności, a Arthur będzie dzwonił do mamy jak zwykle. Jeśli płatność nie dotrze w ciągu 3 dni, zacznie się „Pożegnanie”.

          Przez 3 miesiące od ostatniej rozmowy Arthur zachowuje pamięć spraw mamy. Jeśli w tym czasie wrócicie, podejmie rozmowy tam, gdzie je przerwał. Po 3 miesiącach usuwamy tę pamięć, a na prośbę Twoją albo mamy usuniemy ją wcześniej.
      - typ: wezwanie
        rodzaj: glowne
        objasnienie: false

  # Rozdział bez etykiety: nie wchodzi do spisu „Na tej stronie”.
  - kotwica: najczestsze-pytania
    ton: t2
    h2: Najczęstsze pytania
    bloki:
      - typ: faq
        pytania: [zgoda-mamy, jak-zmienic-termin, czy-dowiem-sie-o-czym-rozmawiaja]
