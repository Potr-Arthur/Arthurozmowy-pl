# arthurozmowy.pl · Pytania
# Sveltia CMS: Strony → Pytania. Stan treści: 11.11.2026 (makieta V2).
# Treść pytań i odpowiedzi jest w bazie (Pytania i odpowiedzi → Baza), a ta strona układa je w rozdziały.
# Nagłówkiem H2 jest nazwa rozdziału, a każde pytanie to karta pytania z nagłówkiem H3.
# To jedyna strona z danymi FAQPage, bo Google prosi o oznaczenie każdego pytania tylko w jednym miejscu witryny.

strona:
  nazwa: Pytania
  szablon: podstrona

seo:
  adres: /pytania
  tytul: Pytania o arthurozmowy – cena, rozmowy z Arthurem, zgoda mamy
  opis: |-
    Czym są arthurozmowy, ile kosztują, jak często Arthur dzwoni do mamy i czym różnią się od teleopieki? Odpowiadamy też na trudne pytania.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [FAQPage, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-11

geo:
  streszczenie: |-
    Odpowiedzi na pytania o arthurozmowy: czym są, kim jest Arthur, jak często i jak długo mama z nim rozmawia, czego potrzebuje, co córka wie z raportu, ile kosztują pakiety, jak działa bezpłatny miesiąc próbny i rezygnacja z opcją „Pożegnanie”, czym arthurozmowy różnią się od teleopieki i opaski SOS oraz co może zrobić córka, gdy mama mieszka sama i coraz rzadziej z kimś rozmawia. Każda odpowiedź zaczyna się od zdania, które samo odpowiada na pytanie.

wejscie:
  h1: |-
    Odpowiadamy na pytania o Arthura, na wszystkie.
  zdjecie:
    widoczne: true
    plik: /images/strony/arthurozmowy-pytania-portret-corki-1x1.webp
    alt: Córka o spiętych włosach, w granatowej bluzce, patrzy prosto w obiektyw z lekkim uśmiechem
  lid: |-
    Zebraliśmy pytania, które warto zadać, zanim zaproponujesz mamie arthurozmowy. Jeśli nie znajdziesz tu odpowiedzi na swoje pytanie, [napisz do nas](/kontakt).
  bloki: []

sekcje:
  - kotwica: arthurozmowy
    etykieta: Arthurozmowy
    ton: t2
    h2: Arthurozmowy
    bloki:
      - typ: pytania
        pytania:
          - czym-sa-arthurozmowy
          - jaka-korzysc-odniesie-mama
          - kim-jest-arthur
          - arthur-a-zatrudniona-osoba
          - w-czym-arthur-nie-pomoze
          - arthurozmowy-a-teleopieka

  - kotwica: rozmowy-z-arthurem
    etykieta: Rozmowy z Arthurem
    ton: t1
    h2: Rozmowy z Arthurem
    bloki:
      - typ: pytania
        pytania:
          - jak-czesto-rozmowy
          - ile-trwa-rozmowa
          - czego-mama-potrzebuje
          - rozmowy-poza-domem

  - kotwica: mama-i-ty
    etykieta: Mama i Ty
    ton: t2
    h2: Mama i Ty
    bloki:
      - typ: pytania
        pytania:
          - mama-mieszka-sama
          - zgoda-mamy
          - czy-dowiem-sie-o-czym-rozmawiaja
          - niepokojaca-zmiana

  - kotwica: cena-i-rezygnacja
    etykieta: Cena i rezygnacja
    ton: t1
    h2: Cena i rezygnacja
    bloki:
      - typ: pytania
        pytania:
          - ile-kosztuja
          - miesiac-probny
          - jak-zrezygnowac

  - kotwica: trudne-pytania
    etykieta: Trudne pytania
    ton: t2
    h2: Trudne pytania
    zdjecie:
      widoczne: true
      plik: /images/strony/arthurozmowy-pytania-corka-z-matka-4x3.webp
      alt: Córka i mama stoją naprzeciw siebie, widoczne z profilu, i patrzą sobie w oczy
    bloki:
      - typ: pytania
        pytania:
          - rozmowa-z-programem
          - czy-nie-wyreczam-sie
          - arthur-czy-oszust
          - gdy-mama-polubi-rozmowy
      - typ: link
        tekst: Jak działa Arthur
        adres: /jak-dziala-arthur
        aktywny: true
      - typ: wezwanie
        rodzaj: glowne
        objasnienie: false
