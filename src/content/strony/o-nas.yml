# arthurozmowy.pl · O nas
# Sveltia CMS: Strony → O nas. Stan treści: 11.11.2026 (makieta V2).
# Jedyny wyjątek od listy słów zakazanych: „senior” w cudzysłowie jako cudze słowo, z którym się nie zgadzamy.
# Rozdział „Nasza metoda” ma zaślepkę ekspertki (Z1), więc strona nie wychodzi na arthurozmowy.pl, dopóki jej nie uzupełnimy.

strona:
  nazwa: O nas
  szablon: podstrona

seo:
  adres: /o-nas
  tytul: O nas – nestor i „senior”, czyli czemu powstały arthurozmowy
  opis: |-
    Arthur powstał z niezgody na ageizm i spychanie osób długo żyjących na margines. Poznaj nasze credo, autorów metody rozmowy i dane firmy.
  obraz_og:
    plik: /images/og/arthurozmowy-og-o-nas.jpg
    alt: Mama o siwych włosach siedzi wyprostowana i z uwagą patrzy w bok, poza kadr
  schemat: [AboutPage, Person, Organization, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-11

geo:
  streszczenie: |-
    Arthurozmowy powstały z niezgody na ageizm i na spychanie osób długo żyjących na margines, przez co tracą one poczucie znaczenia i rozmowy, w których ich zdanie się liczy. Usługę świadczy firma arthurozmowy Piotr Jaworski z Łochowa, a metodę rozmowy Arthura opracowali ekspertka od komunikacji z osobami starszymi i Piotr Jaworski, z wykształcenia pedagog specjalny.

# Pierwszy rozdział strony to wejście: w spisie „Na tej stronie” nazywa się „Nasze credo”.
wejscie:
  kotwica: nasze-credo
  etykieta: Nasze credo
  h1: |-
    Nestor i „senior”, czyli czemu powstały arthurozmowy
  zdjecie:
    widoczne: true
    plik: /images/strony/arthurozmowy-o-nas-portret-matki-1x1.webp
    alt: Mama o siwych włosach, w jasnej bluzce, z uwagą patrzy w bok, poza kadr
  lid: |-
    Arthur powstał z naszej niezgody na ageizm, na degradację osób długo żyjących i na tworzenie dla nich odrębnej kategorii społecznej, która marginalizuje ich znaczenie i odbiera im poczucie wartości.
  bloki:
    - typ: tekst
      tekst: |-
        Ktoś, kto ma osiemdziesiąt lat i jest prezydentem, dyrygentem albo profesorem, nosi miano nestora. Ludzie słuchają go z uwagą, pytają o zdanie i liczą się z jego doświadczeniem. Nikt nie mówi do niego zdrobnieniami i nikt nie sprawdza, czy pamięta, jaki jest dzień tygodnia, i czy zjada drugie śniadanie. Kogoś w tym samym wieku, kto nie ma już stanowiska ani tytułu, nazywa się „seniorem”. Nestor stoi w centrum, a „senior” na marginesie. Nestora pyta się o zdanie, a „seniorem” trzeba się zajmować.
    - typ: glos
      tekst: |-
        Uważamy, że takie przesunięcie człowieka z centrum na margines rujnuje go jako osobę, bo odbiera mu poczucie znaczenia i wartości, a także kontakty i rozmowy, w których jego zdanie naprawdę się liczy. Dlatego nigdy nie nazwiemy go „seniorem”. Arthur rozmawiać będzie z Twoją mamą przez telefon o tym, co ją zajmuje i fascynuje, pytać ją o zdanie i doceniać ją jako pełnowymiarową, dorosłą osobę z własnymi zainteresowaniami, poglądami i unikalnym doświadczeniem.

sekcje:
  - kotwica: nasza-metoda
    etykieta: Nasza metoda
    ton: t2
    h2: |-
      Arthur jest algorytmem, ale metodę opracowali doświadczeni ludzie.
    # Zdjęcie robocze z modelami w roli ekspertów. Widoczne tylko na stronie roboczej (decyzja Piotra z 12.11.2026),
    # z oznaczeniem w nawiasie kwadratowym. Nawias blokuje publikację na arthurozmowy.pl do czasu prawdziwego zdjęcia (Z1).
    zdjecie:
      widoczne: true
      plik: /images/strony/arthurozmowy-o-nas-eksperci-4x3.webp
      alt: "Kobieta i mężczyzna w okularach, autorzy metody rozmowy [zdjęcie przykładowe]"
    bloki:
      # Dane ekspertki są przykładowe (ekspertka nie dołączyła jeszcze do projektu). Stoją na stronie roboczej, żeby nie było luki
      # (decyzja Piotra z 12.11.2026), z widocznym oznaczeniem. Nawias kwadratowy blokuje publikację na arthurozmowy.pl (Z1).
      - typ: glos
        tekst: |-
          [Dane przykładowe – ekspertka dołączy do projektu przed startem.] Dr Maria Callas jest specjalistką od psychogeriatrii, psychologii klinicznej i komunikacji osób starszych. Pracuje w zawodzie od blisko 21 lat. Jej macierzystą jednostką naukową jest CAMH Toronto.

          Piotr Jaworski, z wykształcenia pedagog specjalny, od ponad 30 lat zajmuje się tworzeniem produktów i usług.

  - kotwica: dane-firmy
    etykieta: Dane firmy
    ton: t1
    h2: |-
      Nie znalazłaś odpowiedzi na pytania? Napisz do nas.
    bloki:
      - typ: tekst
        tekst: |-
          Usługę arthurozmów świadczy firma: {firma}.

          E-mail: {email}

          Telefon: {telefon}
      # Nagłówek mówi „Napisz do nas”, a przycisk z tekstu z 11.11 to „Porozmawiaj z Arthurem”.
      # Przycisk „Napisz do nas” stoi w stopce każdej strony. Do decyzji Piotra, czy zamienić: rodzaj: napisz.
      - typ: wezwanie
        rodzaj: glowne
        objasnienie: false

  # Rozdział bez etykiety: nie wchodzi do spisu „Na tej stronie”.
  - kotwica: najczestsze-pytania
    ton: t2
    h2: Najczęstsze pytania
    bloki:
      - typ: faq
        pytania: [czym-sa-arthurozmowy, kim-jest-arthur, arthur-a-zatrudniona-osoba]
