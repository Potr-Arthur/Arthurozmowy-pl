# arthurozmowy.pl · Kontakt
# Sveltia CMS: Strony → Kontakt. Stan treści: 11.11.2026 (makieta V2).
# Strona należy do strefy pieniężnej, więc nie ma na niej słów zakazanych nawet w cytacie.
# E-mail, telefon i godziny pochodzą z ustawień wspólnych (znaczniki {email}, {telefon}, {godziny}).

strona:
  nazwa: Kontakt
  szablon: podstrona

seo:
  adres: /kontakt
  tytul: Kontakt – napisz do nas albo porozmawiaj z Arthurem
  opis: |-
    Napisz do nas albo zadzwoń, jeśli masz pytanie o arthurozmowy. Biuro Obsługi odbiera telefon od poniedziałku do piątku w godzinach od 9:00 do 16:00.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [ContactPage, Organization, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-11

geo:
  streszczenie: |-
    Kontakt z firmą arthurozmowy Piotr Jaworski (Kaliska 155G, 07-130 Łochów, NIP 113 135 29 41): formularz „Napisz do nas”, e-mail kontakt@arthurozmowy.pl i telefon Biura Obsługi +48 519 199 606, czynny od poniedziałku do piątku w godzinach od 9:00 do 16:00. Arthura można poznać w próbnej rozmowie, o którą prosi się przez formularz na stronie, a sprawy abonamentu i płatności załatwia się w panelu klienta.

# Pierwszy rozdział strony to wejście: w spisie „Na tej stronie” nazywa się „Napisz do nas”.
wejscie:
  kotwica: napisz-do-nas
  etykieta: Napisz do nas
  h1: |-
    Napisz do nas albo zadzwoń, jeśli masz pytanie o arthurozmowy.
  zdjecie:
    widoczne: true
    plik: /images/strony/arthurozmowy-kontakt-corka-pisze-na-laptopie-1x1.webp
    alt: Córka w okularach i kolorowej bluzce z uwagą patrzy w ekran laptopa
  lid: |-
    Tu łatwo skontaktujesz się z nami, żeby rozwiać wątpliwości lub załatwić sprawy. Możesz też zostawić swoje dane, a wtedy my skontaktujemy się z Tobą, albo umówić rozmowę z Arthurem.
  bloki:
    - typ: tekst
      tekst: |-
        Jeśli nie znalazłaś na stronie odpowiedzi na swoje pytanie albo chcesz omówić sprawę abonamentu, odezwij się do nas.
    - typ: wezwanie
      rodzaj: napisz
      objasnienie: false
    - typ: tekst
      tekst: |-
        Sprawy abonamentu i płatności załatwisz w panelu klienta. Zobaczysz w nim też raporty i faktury do zapłaty, zmienisz dane i pakiet na kolejny miesiąc, a także zrezygnujesz jednym kliknięciem, które uruchamia opcję „Pożegnanie”. Jeśli coś nie działa albo masz szczególne pytanie o płatność, napisz do nas.
    - typ: wezwanie
      rodzaj: zakupowe
      objasnienie: false

sekcje:
  - kotwica: porozmawiaj-z-arthurem
    etykieta: Porozmawiaj z Arthurem
    ton: t2
    h2: |-
      Chcesz bliżej poznać Arthura? Porozmawiaj z nim teraz.
    zdjecie:
      widoczne: true
      plik: /images/strony/arthurozmowy-kontakt-corka-rozmawia-przez-telefon-4x3.webp
      alt: Córka stoi przy oknie z telefonem przy uchu i z uśmiechem rozmawia
    bloki:
      - typ: tekst
        tekst: |-
          Porozmawiaj z Arthurem chwilę o swoich sprawach, tak jak rozmawiać będzie z nim mama, i oceń, jak mówi i jak słucha. Arthur tylko rozmawia, więc sprawy abonamentu i płatności załatwiasz z nami, a nie z nim.
      - typ: wezwanie
        rodzaj: glowne
        objasnienie: false
      - typ: glos
        tekst: |-
          Pytania możesz też kierować mailem albo po prostu zadzwonić do Biura Obsługi.

          E-mail: {email} | Telefon: {telefon}, {godziny}
