# arthurozmowy.pl · Kontakt
# Sveltia CMS: Strony → Kontakt. Stan treści: 4.11.2026 (jeden temat, jedna nazwa).
# Strona należy do strefy pieniężnej, więc nie ma na niej słów zakazanych nawet w cytacie.
# E-mail, telefon, godziny, czas odpowiedzi i dane firmy pochodzą z ustawień wspólnych.

strona:
  nazwa: Kontakt
  szablon: podstrona

seo:
  adres: /kontakt
  tytul: Kontakt – napisz do nas albo porozmawiaj z Arthurem
  opis: |-
    Napisz do nas albo zadzwoń, jeśli masz pytanie o arthurozmowy. Tu porozmawiasz też z Arthurem i znajdziesz dane firmy, która świadczy usługę.
  obraz_og:
    plik: /images/og/arthurozmowy-og-mama-portret-usmiech.jpg
    alt: Mama o siwych włosach, w błękitnej jedwabnej bluzce, lekko się uśmiecha, patrząc prosto w obiektyw
  schemat: [ContactPage, Organization, BreadcrumbList]
  indeksuj: true
  autor: Piotr Jaworski
  zaktualizowano: 2026-11-04

geo:
  streszczenie: |-
    Kontakt z firmą arthurozmowy Piotr Jaworski (Kaliska 155G, 07-130 Łochów, NIP 113 135 29 41): e-mail kontakt@arthurozmowy.pl i telefon +48 519 199 606, który nie jest numerem alarmowym. Arthura można poznać w próbnej rozmowie, o którą prosi się przez formularz na stronie, a sprawy abonamentu załatwia się w panelu klienta albo z firmą.

wejscie:
  h1: |-
    Napisz do nas albo zadzwoń, jeśli masz pytanie o arthurozmowy.
  h1_wyroznienie: ""
  lid: |-
    Najlepiej poznasz Arthura, gdy sama z nim porozmawiasz. Jeśli jednak nie znalazłaś odpowiedzi na swoje pytanie na stronie [Pytania](/pytania) albo chcesz załatwić sprawę abonamentu, odezwij się do nas.
  zdjecie:
    widoczne: true
    plik_desktop: /images/strony/arthurozmowy-kontakt-rozmowa-z-arthurem-desk.webp
    plik_telefon: /images/strony/arthurozmowy-kontakt-rozmowa-z-arthurem-tel.webp
    alt: Córka w okularach i kolorowej bluzce z uwagą patrzy w ekran laptopa
    kadr: Córka w trakcie próbnej rozmowy z Arthurem przy laptopie widocznym od tyłu, twarz od przodu, ożywiona i rozbawiona, w kolorowej bluzce; sceneria inna niż sesja. Od 4.11.2026 zdjęcie wejścia strony Kontakt.
  wezwania:
    glowne: false
    dopisek: false
    jawnosc: false
    zakupowe: false
    nad_zakupowym: false
  pokaz_autora_i_date: true

sekcje:
  # Blok 3 · rozdział, 5 · lista: e-mail, telefon z godzinami, zdanie o czasie odpowiedzi, uwaga o 112
  - typ: kontakt
    kotwica: napisz-do-nas
    etykieta: Napisz do nas
    ton: t2
    h2: |-
      Na pytania o arthurozmowy odpowiadamy mailowo i przez telefon.
    tekst: ""
    pokaz:
      email: true
      telefon: true
      godziny_telefonu: true
      czas_odpowiedzi: true
    uwaga: |-
      Ten numer nie jest numerem alarmowym. W nagłej sytuacji dzwoń pod 112.

  # Blok 13 · zdjęcie pionowe, 3 · rozdział, 12 · wezwania
  - typ: rozdzial
    kotwica: porozmawiaj-z-arthurem
    etykieta: Porozmawiaj z Arthurem
    ton: t1
    h2: |-
      Chcesz bliżej poznać Arthura? Porozmawiaj z nim teraz.
    tekst: |-
      Porozmawiaj z Arthurem chwilę o swoich sprawach, tak jak rozmawiać będzie z nim mama, i oceń, jak mówi i jak słucha. Arthur tylko rozmawia, więc sprawy abonamentu i płatności załatwiasz z nami, a nie z nim.
    zdjecie:
      widoczne: true
      plik_desktop: /images/strony/arthurozmowy-kontakt-telefon-przy-oknie-desk.webp
      plik_telefon: /images/strony/arthurozmowy-kontakt-telefon-przy-oknie-tel.webp
      alt: Córka stoi przy oknie z telefonem przy uchu i z uśmiechem rozmawia
      kadr: Decyzja z 5.11.2026, prompt G – córka przy oknie, z profilu, telefon przy uchu, rozmawia z ożywieniem i uśmiechem, koszula w kolorze dżinsu.
    wezwania:
      glowne: true
      dopisek: false
      jawnosc: false
      zakupowe: false
      nad_zakupowym: false

  - typ: rozdzial
    kotwica: panel-klienta
    etykieta: Panel klienta
    ton: t4
    h2: |-
      Sprawy abonamentu załatwisz w panelu klienta albo z nami.
    tekst: |-
      W panelu klienta zobaczysz raporty i płatności, zmienisz dane i pakiet na kolejny miesiąc, a także zrezygnujesz jednym kliknięciem, które uruchamia opcję „Pożegnanie”. Jeśli coś nie działa albo masz pytanie o płatność, napisz do nas.
    linki:
      - tekst: Panel klienta
        adres: https://app.arthurozmowy.pl
        aktywny: true

  # Blok 14 · dane firmy. {firma} = linia z danymi firmy z ustawień wspólnych.
  - typ: kontakt
    kotwica: dane-firmy
    etykieta: Dane firmy
    ton: t1
    h2: |-
      Usługę arthurozmowy świadczy firma arthurozmowy Piotr Jaworski.
    tekst: |-
      {firma}.
    pokaz:
      email: false
      telefon: false
      godziny_telefonu: false
      czas_odpowiedzi: false
    uwaga: ""
    linki:
      - tekst: O nas
        adres: /o-nas
        aktywny: true
      - tekst: Regulamin
        adres: /regulamin
        aktywny: true
      - tekst: Polityka prywatności
        adres: /prywatnosc
        aktywny: true

  # Blok 19 · trzy pytania w akordeonie (propozycja wyboru). W prototypie strona nie ma pasa wezwań na końcu.
  - typ: faq
    kotwica: najczestsze-pytania
    ton: t2
    h2: Najczęstsze pytania
    pytania: [miesiac-probny, jak-zrezygnowac, arthur-czy-oszust]
    linki:
      - tekst: Wszystkie pytania
        adres: /pytania
        aktywny: true
